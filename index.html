<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSA QLTK — Quản lý tài khoản</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--bg:#0f1117;--panel:#171a23;--panel2:#1e2230;--line:#2a2f3e;--text:#e6e8ee;--muted:#8b92a7;
    --brand:#3ecf8e;--brand2:#2fae77;--green:#3ecf8e;--amber:#f2c14e;--red:#f06a6a;--blue:#5b8cff;--purple:#9b7bff;--radius:12px;}
  body.t-dark{--bg:#0f1117;--panel:#171a23;--panel2:#1e2230;--line:#2a2f3e;--text:#e6e8ee;--muted:#8b92a7;--brand:#3ecf8e;--brand2:#2fae77;}
  body.t-light{--bg:#f4f3ee;--panel:#ffffff;--panel2:#faf9f5;--line:#e5e4dd;--text:#1a1a18;--muted:#6b6a64;--brand:#0f6e56;--brand2:#0c5a47;--green:#0f6e56;--amber:#9a6a00;--red:#a32d2d;--blue:#0c447c;--purple:#3c3489;}
  body.t-slate{--bg:#0e1217;--panel:#161b22;--panel2:#1d242d;--line:#2b3340;--text:#e8edf2;--muted:#8a97a6;--brand:#56b6c2;--brand2:#3f95a0;}
  body.t-grape{--bg:#150f22;--panel:#1e1633;--panel2:#271c44;--line:#392a57;--text:#ece6f7;--muted:#a597c0;--brand:#b98bff;--brand2:#9b6bff;}
  body.t-ocean{--bg:#eaf4f7;--panel:#ffffff;--panel2:#e7f2f5;--line:#cfe4ea;--text:#0e2a32;--muted:#577680;--brand:#0e8aa3;--brand2:#0c7689;--green:#0f9b6c;--amber:#bf850b;--red:#dd4a44;--blue:#0c447c;--purple:#5b4ca8;}
  body.t-mint{--bg:#ecf5ee;--panel:#ffffff;--panel2:#e9f4ec;--line:#d3e8d9;--text:#10291b;--muted:#5a7766;--brand:#1f9d5b;--brand2:#17854c;--green:#15a05f;--amber:#b9820a;--red:#e0443e;--blue:#0c447c;--purple:#5b4ca8;}
  body.t-sunset{--bg:#f8f0ea;--panel:#fffdfb;--panel2:#f6ece4;--line:#ecdcd0;--text:#33211a;--muted:#86695a;--brand:#e0664a;--brand2:#cf5538;--green:#15a05f;--amber:#c2870c;--red:#d83b3b;--blue:#0c447c;--purple:#7c5cff;}
  body.t-light .card,body.t-light .side,body.t-light .box,
  body.t-ocean .card,body.t-ocean .side,body.t-ocean .box,
  body.t-mint .card,body.t-mint .side,body.t-mint .box,
  body.t-sunset .card,body.t-sunset .side,body.t-sunset .box{box-shadow:0 1px 3px rgba(20,30,60,.05)}
  .theme-pop{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.28);padding:10px;z-index:300;width:215px}
  .theme-pop .tp-h{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin:2px 4px 8px}
  .theme-pop .tp-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .theme-pop .tp{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1.5px solid var(--line);border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text)}
  .theme-pop .tp:hover{background:var(--panel2)}
  .theme-pop .tp.on{border-color:var(--brand)}
  .theme-pop .sw{width:18px;height:18px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.15)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  .app{display:flex;min-height:100vh}
  .side{width:225px;background:var(--panel);border-right:1px solid var(--line);padding:14px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto}
  .logo{display:flex;align-items:center;gap:10px;padding:4px 6px 10px}
  .logo .dot{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
  .logo b{font-size:14px}.logo small{display:block;color:var(--muted);font-size:11px}
  .user{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px}
  .user .av{width:28px;height:28px;border-radius:50%;background:var(--brand2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .user b{font-size:12.5px}.user small{display:block;color:var(--muted);font-size:11px}
  .user .out{margin-left:auto;color:var(--muted);cursor:pointer;font-size:14px}
  .nav{display:flex;flex-direction:column}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--muted);cursor:pointer;font-weight:500;margin-bottom:1px;white-space:nowrap;font-size:13.5px}
  .nav a:hover{background:var(--panel2);color:var(--text)}
  .nav a.active{background:var(--brand);color:#fff}
  .nav a .ic{width:18px;text-align:center;flex-shrink:0}
  .nav .bell{margin-left:auto;background:var(--red);color:#fff;border-radius:20px;font-size:10px;padding:1px 7px;font-weight:700;display:none}
  .nav .sec{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:10px 11px 4px;font-weight:700}
  .main{flex:1;padding:20px 26px;max-width:1500px;width:100%;margin:0 auto;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
  .topbar h1{font-size:20px}.topbar .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
  .btn{background:var(--brand);color:#fff;border:none;padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;font-size:13px}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .btn.danger{background:var(--red)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .view{display:none}.view.active{display:block}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(5,1fr)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .kpi .label{color:var(--muted);font-size:12px}
  .kpi .val{font-size:25px;font-weight:800;margin-top:6px}
  .kpi .delta{font-size:11.5px;margin-top:4px;color:var(--muted)}
  .up{color:var(--green)}.down{color:var(--red)}
  .card h3{font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card h3 .tag{font-size:11px;color:var(--muted);font-weight:500}
  canvas{max-height:240px}
  .tbl-wrap{overflow:auto;border-radius:var(--radius)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;background:var(--panel);z-index:2}
  th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--text)}
  tr:hover td{background:var(--panel2)}
  td.num,th.num{text-align:right}
  .chip{font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:600;display:inline-block;white-space:nowrap}
  .chip.green{background:rgba(62,207,142,.16);color:var(--green)}
  .chip.red{background:rgba(240,106,106,.16);color:var(--red)}
  .chip.amber{background:rgba(242,193,78,.18);color:var(--amber)}
  .chip.blue{background:rgba(91,140,255,.16);color:var(--blue)}
  .chip.purple{background:rgba(155,123,255,.16);color:var(--purple)}
  .chip.mut{background:var(--panel2);color:var(--muted)}
  .filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .filters input,.filters select{background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:8px 11px;color:var(--text);font-size:13px}
  .filters input:focus,.filters select:focus{outline:none;border-color:var(--brand)}
  .filters input.search{min-width:200px;flex:1}
  .filters .cnt{margin-left:auto;color:var(--muted);font-size:12px}
  .empty{padding:34px;text-align:center;color:var(--muted)}
  .lnk{cursor:pointer}.lnk:hover{text-decoration:underline;color:var(--brand)}
  .kpi.clk{cursor:pointer;transition:transform .1s}.kpi.clk:hover{transform:translateY(-2px);border-color:var(--brand)}
  .alert{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel);cursor:pointer}
  .alert .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
  .alert.seen{opacity:.45}
  .alert.hi .ic{background:rgba(240,106,106,.16);color:var(--red)}
  .alert.mid .ic{background:rgba(242,193,78,.18);color:var(--amber)}
  .alert.lo .ic{background:var(--panel2);color:var(--muted)}
  .alert b{font-size:13px}.alert .who{font-size:11.5px;color:var(--muted)}
  .alert .seen-tag{font-size:11px;color:var(--green);white-space:nowrap}
  /* form modal */
  .modal{position:fixed;inset:0;background:rgba(8,12,22,.6);z-index:120;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
  .modal.show{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:720px;max-width:100%;box-shadow:0 18px 50px rgba(0,0,0,.4)}
  .modal .mh{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
  .modal .mh b{font-size:15px}
  .modal .mx{cursor:pointer;color:var(--muted);font-size:18px;padding:2px 8px;border-radius:6px}
  .modal .mx:hover{background:var(--panel2)}
  .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding:18px}
  .formgrid .fld label{font-size:11.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:5px}
  .formgrid .fld label .req{color:var(--red)}
  .formgrid .fld input,.formgrid .fld select,.formgrid .fld textarea{width:100%;background:var(--panel2);border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--text);font-size:13.5px}
  .formgrid .fld input:focus,.formgrid .fld select:focus,.formgrid .fld textarea:focus{outline:none;border-color:var(--brand)}
  .formgrid .fld.full{grid-column:1/-1}
  .modal .mf{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .mf .err{margin-right:auto;color:var(--red);font-size:12.5px;align-self:center}
  /* import preview */
  .impTable td,.impTable th{font-size:12px;padding:6px 8px}
  .impErr{color:var(--red)}
  /* login */
  .ov{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
  .ov.hide{display:none}
  .lbox{width:380px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px}
  .lbox .lg{display:flex;align-items:center;gap:11px;margin-bottom:6px}
  .lbox .dot{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
  .tabs{display:flex;gap:6px;margin:18px 0 4px}
  .tabs span{flex:1;text-align:center;padding:9px;border-radius:9px;background:var(--panel2);color:var(--muted);cursor:pointer;font-size:13px;font-weight:600}
  .tabs span.on{background:var(--brand);color:#fff}
  .lbox label{font-size:12px;color:var(--muted);display:block;margin:13px 0 5px}
  .lbox input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);font-size:14px}
  .lbox .full{width:100%;margin-top:18px}
  .msg{margin-top:14px;font-size:12.5px;line-height:1.5;padding:11px 13px;border-radius:9px;display:none}
  .msg.err{display:block;color:var(--red);background:rgba(240,106,106,.1);border:1px solid rgba(240,106,106,.3)}
  .msg.okk{display:block;color:var(--green);background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.3)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--brand);color:#04231a;font-weight:700;padding:11px 20px;border-radius:11px;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;transition:.3s;z-index:200;pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .hamb{display:none}
  @media(max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}}
  @media(max-width:760px){
    .app{flex-direction:column}.side{width:100%;height:auto;position:relative}
    .side.collapsed .nav,.side.collapsed .user{display:none}
    .hamb{display:block;margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 11px;cursor:pointer}
    .main{padding:14px}.filters input.search{min-width:130px}
  }
</style>
</head>

<!-- LOGIN -->
<div class="ov" id="login">
  <div class="lbox">
    <div class="lg"><div class="dot">R</div><div><b>RSA QLTK</b><small style="color:var(--muted);display:block">Quản lý tài khoản · tài nguyên · chi phí</small></div></div>

<script>
/* ============ CẤU HÌNH SUPABASE ============ */
const SUPABASE_URL='https://oaeywvuibltnokdkbpvg.supabase.co';
const SUPABASE_KEY='sb_publishable_UW_EwaozbQ_ZiI4-COHFKg_yPOTKT5A';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let ME=null, CACHE={}, CATS={}, ACCOUNTS=[], PERMS={};
let DF=(()=>{try{return Object.assign({seller:'',plat:'',src:'',period:'all',from:'',to:''},JSON.parse(localStorage.getItem('rsa_df')||'{}'));}catch(e){return {seller:'',plat:'',src:'',period:'all',from:'',to:''};}})(); // bộ lọc chung, nhớ theo máy
let SORT={}; // {module:{col,dir}}
const ROLE_LABEL={SD:'SD',QL:'Leader',PA:'Quản lý tài khoản',SELLER:'Seller',FFM:'Media',PENDING:'Chờ duyệt'};
const rlabel=r=>ROLE_LABEL[r]||r;

/* ============ TIỆN ÍCH ============ */
const $=id=>document.getElementById(id);
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr=()=>new Date().toISOString().slice(0,10);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function num(v){const n=Number(v);return isNaN(n)?0:n;}
// Đọc số "lỏng": VND ("1.500.000₫" → 1500000), USD giữ thập phân ("182.45" → 182.45)
function parseNumLoose(raw,key){
  if(raw==null||raw==='')return null;
  let s=String(raw).replace(/[₫$\s]/g,'').replace(/[^\d.,\-]/g,'');
  if(s===''||s==='-')return null;
  if((key||'').endsWith('_vnd')){return Math.round(Number(s.replace(/[.,]/g,''))||0);} // VND: bỏ mọi dấu phân cách
  if(s.includes(',')&&s.includes('.')){s=s.replace(/,/g,'');} // 1,234.56 → 1234.56
  else if(s.includes(',')&&!s.includes('.')){s=s.replace(/,/g,'.');} // 12,5 → 12.5
  const n=Number(s);return isNaN(n)?null:n;
}
function fmtVnd(v){return num(v).toLocaleString('vi-VN');}
function fmtUsd(v){return num(v).toLocaleString('en-US',{maximumFractionDigits:2});}
function daysBetween(a,b){if(!a)return null;return Math.floor((new Date(b||todayStr())-new Date(a))/86400000);}
function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toISOString().slice(0,10);}
function parseDateAny(v){if(!v)return null;if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
  const s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return null;}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){show('login');return;}
  const {data:prof}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(!prof){show('login');return;}
  ME=prof;
  if(prof.status!=='approved'||prof.role==='PENDING'){show('pending');return;}
  show('app');
  $('uName').textContent=prof.full_name||prof.email;
  $('uRole').textContent=rlabel(prof.role)+(prof.seller_name?' · '+prof.seller_name:'');
  $('uAv').textContent=(prof.full_name||prof.email||'?').slice(0,1).toUpperCase();
  await loadCats();
  await loadMenuPerms();
  buildNav();
  let last='dash';try{last=localStorage.getItem('rsa_view')||'dash';}catch(e){}
  const nav=NAV.find(n=>n.key===last);
  go(nav&&menuAllowed(nav,ME.role)?last:'dash');
  refreshNotiBadge();
}
function show(w){$('login').classList.toggle('hide',w!=='login');$('pending').classList.toggle('hide',w!=='pending');$('app').style.display=w==='app'?'flex':'none';}

async function loadCats(){
  const {data}=await sb.from('categories').select('*').eq('active',true).order('sort');
  CATS={};(data||[]).forEach(c=>{(CATS[c.group_name]=CATS[c.group_name]||[]).push(c.value);});
}
function catOpts(g){return CATS[g]||[];}
async function loadMenuPerms(){
  const {data}=await sb.from('menu_permissions').select('*');
  PERMS={};(data||[]).forEach(r=>PERMS[r.role+'|'+r.menu_key]=r.allowed);
}
function menuAllowed(n,role){
  if(role==='SD')return true;
  if(n.key==='perms'||n.key==='log')return false; // luôn chỉ SD
  const k=role+'|'+n.key;
  if(PERMS[k]!==undefined)return PERMS[k];
  return n.roles.includes(role);
}

async function go(key){

/* ============ ENGINE: render module bảng ============ */

        <button class="btn ghost sm" onclick="exportXlsx('${key}')">⇩ Xuất Excel</button>
        ${canAdd?`<button class="btn sm" onclick="openForm('${key}')">+ Thêm</button>`:''}
        <input type="file" id="impFile" accept=".xlsx,.xls,.csv" style="display:none" onchange="importXlsx('${key}',this.files[0]);this.value=''">
      </div></div>
    <div class="filters"><input class="search" id="modSearch" placeholder="Tìm..." oninput="paintRows('${key}')">
      ${cfg.sellerScope&&['SD','QL','PA'].includes(ME.role)?`<select id="modSeller" onchange="paintRows('${key}')"><option value="">Tất cả seller</option>${catOpts('seller').map(s=>`<option>${esc(s)}</option>`).join('')}</select>`:''}
      ${(cfg.filters||[]).map(ft=>`<select id="mf_${ft[0]}" onchange="paintRows('${key}')"><option value="">${ft[1]}</option>${(ft[2]==='data'?[]:ft[2]()).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`).join('')}
      ${key==='expenses'?`<select id="modGroup" onchange="paintRows('expenses')"><option value="">Tất cả nhóm</option>${catOpts('nhom_chi_phi').map(g=>`<option>${esc(g)}</option>`).join('')}</select>
      <input type="date" id="modFrom" onchange="paintRows('expenses')" title="Từ ngày">→<input type="date" id="modTo" onchange="paintRows('expenses')" title="Đến ngày">`:''}
      ${(cfg.filters||cfg.sellerScope||key==='expenses')?`<button class="btn ghost sm" onclick="clearModFilters('${key}')">Xóa lọc</button>`:''}
      <span class="cnt" id="modCount"></span></div>
    <div class="card" style="padding:0"><div class="tbl-wrap"><table>
      <thead><tr>${canDel?'<th style="width:30px"><input type="checkbox" id="selAll" onclick="toggleAll(\''+key+'\',this.checked)"></th>':''}${cfg.cols.map(c=>{const s=SORT[key];const ar=s&&s.col===c?(s.dir>0?' ▲':' ▼'):'';const sortable=!['subacc','stageBar'].includes(c);return `<th ${sortable?`class="sortable" onclick="sortMod('${key}','${c}')"`:''}>${colLabel(cfg,c)}${ar}</th>`;}).join('')}${showAct?'<th></th>':''}</tr></thead>
      <tbody id="modBody"></tbody></table>
      <div class="empty" id="modEmpty" style="display:none">Chưa có dữ liệu. ${canEdit?'Bấm "+ Thêm" hoặc Nhập Excel.':''}</div>
    </div></div>`;

  restoreModFilters(key);

function clearModFilters(key){
  ['modSearch','modSeller','modGroup','modFrom','modTo'].forEach(id=>{if($(id))$(id).value='';});
  (MODULES[key].filters||[]).forEach(ft=>{if($('mf_'+ft[0]))$('mf_'+ft[0]).value='';});
  localStorage.removeItem('flt_'+key);paintRows(key);
}
function sortMod(key,col){const s=SORT[key];SORT[key]=(s&&s.col===col)?{col,dir:-s.dir}:{col,dir:1};paintRows(key);}
function saveModFilters(key){
  const st={search:$('modSearch')?.value||'',seller:$('modSeller')?.value||'',group:$('modGroup')?.value||'',from:$('modFrom')?.value||'',to:$('modTo')?.value||''};
  (MODULES[key].filters||[]).forEach(ft=>{st['mf_'+ft[0]]=$('mf_'+ft[0])?.value||'';});
  try{localStorage.setItem('flt_'+key,JSON.stringify(st));}catch(e){}
}
function restoreModFilters(key){
  let st;try{st=JSON.parse(localStorage.getItem('flt_'+key)||'null');}catch(e){}if(!st)return;
  const set=(id,v)=>{if($(id)&&v)$(id).value=v;};
  set('modSearch',st.search);set('modSeller',st.seller);set('modGroup',st.group);set('modFrom',st.from);set('modTo',st.to);
  (MODULES[key].filters||[]).forEach(ft=>set('mf_'+ft[0],st['mf_'+ft[0]]));
}
function colLabel(cfg,c){
  const map={account_label:'TK',platform:'Sàn',seller:'Seller',sla:'SLA',wait:'Chờ (ngày)',exp:'Còn lại',stageBar:'Giai đoạn',subacc:'TK phân quyền'};
  if(map[c])return map[c];
  const f=cfg.fields.find(x=>x.k===c);return f?f.l:c;
}
function paintRows(key){
  const cfg=MODULES[key];let rows=(MOD_STATE[key]||[]).slice();
  const term=($('modSearch')?.value||'').toLowerCase();
  if(term)rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(term));
  if(ME.role==='SELLER'&&cfg.sellerScope)rows=rows.filter(r=>r[cfg.sellerScope]===ME.seller_name);
  const sf=$('modSeller')?.value;if(sf)rows=rows.filter(r=>r[cfg.sellerScope]===sf);
  (cfg.filters||[]).forEach(ft=>{const el=$('mf_'+ft[0]);if(el&&el.value)rows=rows.filter(r=>String(r[ft[0]]??'')===el.value);});
  const gf=$('modGroup')?$('modGroup').value:'';if(gf)rows=rows.filter(r=>r.group_name===gf);
  const df=$('modFrom')?$('modFrom').value:'',dt=$('modTo')?$('modTo').value:'';
  if(df)rows=rows.filter(r=>(r.expense_date||'')>=df);
  if(dt)rows=rows.filter(r=>(r.expense_date||'')<=dt);
  saveModFilters(key);
  const s=SORT[key];
  if(s){rows.sort((a,b)=>{let x=a[s.col],y=b[s.col];const nx=Number(x),ny=Number(y);
    if(!isNaN(nx)&&!isNaN(ny)&&x!==''&&x!=null&&y!==''&&y!=null){return (nx-ny)*s.dir;}
    return String(x??'').localeCompare(String(y??''),'vi')*s.dir;});}
  else if(key==='accounts'){const RANK={'Active':0,'Mới':1,'Suspend':3,'Die':4,'Thu hồi':5};
    rows.sort((a,b)=>((RANK[a.status]??2)-(RANK[b.status]??2))||String(a.name??'').localeCompare(String(b.name??''),'vi'));}
  const canEdit=['SD','PA'].includes(ME.role);
  const showAct=canEdit||key==='requests'||(key==='accounts'&&ME.role==='SELLER');
  let cnt=rows.length+' dòng';
  if(cfg.money){cnt+=' · tổng '+fmtVnd(rows.reduce((a,r)=>a+num(r[cfg.money]),0))+'₫';}
  if(key==='accounts'){const h=rows.reduce((a,r)=>a+num(r.onhold_usd),0),b=rows.reduce((a,r)=>a+num(r.balance_usd),0);if(h||b)cnt+=` · on-hold $${fmtUsd(h)} · balance $${fmtUsd(b)}`;}
  const canDel=['SD','PA'].includes(ME.role);
  if(canDel)cnt+=' · đã chọn '+SEL.size;
  $('modCount').textContent=cnt;
  $('modEmpty').style.display=rows.length?'none':'block';
  $('modBody').innerHTML=rows.map(r=>`<tr>${canDel?`<td><input type="checkbox" class="rowSel" ${SEL.has(r.id)?'checked':''} onclick="toggleSel('${key}',${r.id},this.checked)"></td>`:''}${cfg.cols.map(c=>`<td>${cellVal(cfg,r,c)}</td>`).join('')}${showAct?`<td style="text-align:right;white-space:nowrap">${rowActs(key,r,canEdit)}</td>`:''}</tr>`).join('');
  updateBulkBar();
}
let SEL=new Set();
function toggleSel(key,id,on){if(on)SEL.add(id);else SEL.delete(id);updateBulkBar();}
function toggleAll(key,on){
  // chọn/bỏ mọi dòng đang hiển thị (sau khi đã lọc)
  const ids=[...document.querySelectorAll('#modBody .rowSel')].map(cb=>Number(cb.getAttribute('onclick').match(/,(\d+),/)[1]));

function updateBulkBar(){

  if($('selCnt'))$('selCnt').textContent=SEL.size;
}
async function deleteSelected(key){
  const cfg=MODULES[key];const ids=[...SEL];
  if(!ids.length)return;
  if(!confirm(`Xóa ${ids.length} dòng đã chọn? Không khôi phục được.`))return;
  const {error}=await sb.from(cfg.table).delete().in('id',ids);
  if(error)return toast('Lỗi: '+error.message);
  await logAct('Xóa hàng loạt',cfg.table,ids.length+' dòng','');

function rowActs(key,r,canEdit){
  let h='';
  if(key==='requests'){
    if(r.approval_status==='Chờ duyệt'&&['QL','SD'].includes(ME.role))h+=`<button class="btn sm" onclick="reqApprove(${r.id},true)">✓ Duyệt</button> <button class="btn danger sm" onclick="reqApprove(${r.id},false)">✕ Từ chối</button> `;
    if(r.approval_status==='Đã duyệt'&&r.issue_status==='Chưa'&&canEdit)h+=`<button class="btn sm" onclick="openIssue(${r.id})">Cấp TK</button> `;
  }
  if(key==='accounts'&&(canEdit||ME.role==='SELLER'))h+=`<button class="btn sm" onclick="openQuickTT(${r.id})">Đổi trạng thái</button> `;
  if(key==='accounts'&&ME.role==='SELLER')h+=`<button class="btn danger sm" onclick="openReport(${r.id})">⚠ Báo lỗi</button> `;
  if(canEdit)h+=`<button class="btn ghost sm" onclick="openForm('${key}',${r.id})">Sửa</button> `;
  if(['SD','PA'].includes(ME.role))h+=`<button class="btn danger sm" onclick="delRow('${key}',${r.id})">Xóa</button>`;
  return h;
}
function badge(cfg,field,val){const b=cfg.badges&&cfg.badges[field]&&cfg.badges[field][val];return `<span class="chip ${b||'mut'}">${esc(val||'—')}</span>`;}
function cellVal(cfg,r,c){
  if(c==='account_label')return esc(accLabel(r.account_id));
  if(c==='platform'&&cfg.table==='cases')return esc(r.platform||'');
  if(c==='sla'){const d=daysBetween(r.date_start,r.date_appeal||null);if(['Thành công','Thất bại','Dừng'].includes(r.status))return '<span class="chip mut">đóng</span>';if(d!=null&&d>1&&!r.date_appeal)return `<span class="chip red">${d}d chưa kháng</span>`;return `<span class="chip ${d>1?'amber':'green'}">${d??0}d</span>`;}
  if(c==='wait'){const d=daysBetween(r.request_date);if(r.approval_status!=='Chờ duyệt')return '<span class="chip mut">—</span>';return `<span class="chip ${d>2?'red':'amber'}">${d??0}d</span>`;}
  if(c==='exp'){const k=r.date_end||r.renew_date||r.data_expiry;const d=daysBetween(todayStr(),k);if(!k)return '<span class="chip mut">—</span>';if(d<0)return '<span class="chip red">hết hạn</span>';return `<span class="chip ${d<=7?'amber':'green'}">${d}d</span>`;}
  if(c==='stageBar'){return badge(cfg,'stage',r.stage);}
  if(c==='subacc'){const subs=(window.SUBMAP&&window.SUBMAP[r.id])||[];const act=subs.filter(s=>s.status==='Đang dùng').length;
    const canEdit=['SD','PA'].includes(ME.role);
    if(!subs.length)return canEdit?`<span class="chip blue lnk" onclick="event.stopPropagation();showSubs(${r.id})">+ thêm</span>`:'<span class="chip mut">—</span>';
    return `<span class="chip green lnk" onclick="event.stopPropagation();showSubs(${r.id})">🔑 ${act}/${subs.length}</span>`;}
  const f=cfg.fields.find(x=>x.k===c);
  let v=r[c];
  if(cfg.badges&&cfg.badges[c]){let h=badge(cfg,c,v);if(c==='status'&&cfg.table==='accounts'&&window.OPEN_KH&&window.OPEN_KH.has(r.id))h+=' <span class="chip purple">⚖ kháng</span>';return h;}
  if(c==='name'&&cfg.table==='accounts')return `<span class="lnk" onclick="event.stopPropagation();openAccProfile(${r.id})"><b>${esc(v||'')}</b></span>`;
  if(f&&f.t==='num'){if(c.endsWith('_vnd'))return `<span class="num">${fmtVnd(v)}</span>`;if(c.endsWith('_usd'))return `<span class="num">${fmtUsd(v)}</span>`;return v??'';}
  if(f&&f.sensitive&&ME.role==='SELLER')return '<span class="chip mut">ẩn</span>';
  return esc(v==null?'':String(v).slice(0,40));
}

/* ============ FORM thêm/sửa ============ */
let FORM_CFG=null, FORM_ID=null, FORM_MODE=null;
function openForm(key,id){
  const cfg=MODULES[key];FORM_CFG=key;FORM_ID=id||null;FORM_MODE=null;
  const row=id?(MOD_STATE[key]||[]).find(r=>r.id===id):{};
  $('modalTitle').textContent=(id?'Sửa ':'Thêm ')+cfg.title;
  $('modalErr').textContent='';
  $('modalBody').innerHTML=cfg.fields.map(f=>{
    if(f.sensitive&&ME.role==='SELLER')return '';
    if(f.roles&&!f.roles.includes(ME.role))return '';
    if(f.k==='seller'&&cfg.table==='account_requests'&&ME.role==='SELLER')
      return `<div class="fld"><label>${esc(f.l)}</label><input id="ff_seller" value="${esc(ME.seller_name||'')}" disabled></div>`;
    let inp='';const v=row[f.k]??'';
    if(f.t==='sel'||f.t==='cat'){
      const opts=f.t==='cat'?catOpts(f.cat):f.opts;
      inp=`<select id="ff_${f.k}"><option value=""></option>${opts.map(o=>`<option ${String(v)===String(o)?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    }else if(f.t==='acc'){
      inp=`<select id="ff_${f.k}"><option value="">—</option>${ACCOUNTS.map(a=>`<option value="${a.id}" ${String(v)===String(a.id)?'selected':''}>${esc(a.name)} (${a.platform})</option>`).join('')}</select>`;
    }else if(f.t==='textarea'){
      inp=`<textarea id="ff_${f.k}" rows="2">${esc(v)}</textarea>`;
    }else{
      inp=`<input id="ff_${f.k}" type="${f.t==='num'?'number':f.t==='date'?'date':'text'}" value="${esc(v)}">`;
    }
    return `<div class="fld ${f.full?'full':''}"><label>${esc(f.l)}${f.req?' <span class="req">*</span>':''}</label>${inp}</div>`;
  }).join('');
  $('modal').classList.add('show');
}
function closeModal(){$('modal').classList.remove('show');}
$('modalSave').onclick=async()=>{
  if(FORM_MODE==='tt'){
    const status=$('ff_status').value,error_type=$('ff_error_type').value||null;
    if(!status){$('modalErr').textContent='Chọn trạng thái';return;}
    const {error}=await sb.from('accounts').update({status,error_type}).eq('id',FORM_ID);
    if(error){$('modalErr').textContent='Lỗi: '+error.message;return;}
    await logAct('Đổi trạng thái','accounts',FORM_ID,'→ '+status);
    toast('Đã đổi trạng thái ✓');closeModal();FORM_MODE=null;renderModule('accounts');return;
  }
  if(FORM_MODE==='issue'){
    const patch={issue_status:$('ff_issue').value,issued_account_id:$('ff_issue_acc').value?Number($('ff_issue_acc').value):null,issued_date:$('ff_issue_date').value||null};
    const {error}=await sb.from('account_requests').update(patch).eq('id',FORM_ID);
    if(error){$('modalErr').textContent='Lỗi: '+error.message;return;}
    await logAct('Cấp TK','account_requests',FORM_ID,patch.issue_status);
    toast('Đã ghi nhận cấp TK ✓');closeModal();FORM_MODE=null;renderModule('requests');return;
  }
  if(FORM_MODE==='report'){
    const loai=$('ff_rep_type').value,note=$('ff_rep_note').value.trim();
    const acc=(MOD_STATE['accounts']||[]).find(x=>x.id===FORM_ID);
    const {error}=await sb.from('cases').insert({account_id:FORM_ID,error_type:loai,status:'Pending',date_start:todayStr(),note:note||null,created_by:ME.id});
    if(error){$('modalErr').textContent='Lỗi: '+error.message;return;}
    await logAct('Seller báo lỗi','cases',acc?acc.name:FORM_ID,loai);
    toast('Đã gửi báo lỗi ✓ Quản lý TK và Media sẽ nhận thông báo');closeModal();FORM_MODE=null;renderModule('accounts');return;
  }
  const cfg=MODULES[FORM_CFG];const out={};
  for(const f of cfg.fields){
    if(f.sensitive&&ME.role==='SELLER')continue;
    if(f.roles&&!f.roles.includes(ME.role))continue;
    const el=$('ff_'+f.k);if(!el)continue;let v=el.value;
    if(f.req&&!String(v).trim()){$('modalErr').textContent='Thiếu: '+f.l;return;}
    if(v==='')v=null;
    else if(f.t==='num')v=num(v);
    else if(f.t==='acc')v=v?Number(v):null;
    out[f.k]=v;
  }
  if(cfg.table==='account_requests'&&ME.role==='SELLER')out.seller=ME.seller_name;
  $('modalSave').disabled=true;
  try{
    if(FORM_ID){const {error}=await sb.from(cfg.table).update(out).eq('id',FORM_ID);if(error)throw error;await logAct('Sửa',cfg.table,out.name||out.batch_name||out.gmail||FORM_ID,'');}
    else{
      Object.keys(out).forEach(k=>{if(out[k]==null)delete out[k];});
      if(cfg.userCol)out[cfg.userCol]=ME.id;
      const {error}=await sb.from(cfg.table).insert(out);if(error)throw error;
      await logAct('Thêm',cfg.table,out.name||out.batch_name||out.gmail||out.content||'','');
    }
    let hint='';
    if(cfg.table==='cases'){if(out.status==='Thành công')hint=' — Gợi ý: đổi TK về Active';else if(['Thất bại','Dừng'].includes(out.status))hint=' — Gợi ý: đổi TK sang Die';}
    toast('Đã lưu ✓'+hint);closeModal();renderModule(FORM_CFG);
  }catch(e){$('modalErr').textContent=e.code==='23505'?'Trùng dữ liệu (khóa duy nhất đã tồn tại).':('Lỗi: '+e.message);}
  $('modalSave').disabled=false;
};
async function delRow(key,id){
  const cfg=MODULES[key];if(!confirm('Xóa dòng này?'))return;
  const {error}=await sb.from(cfg.table).delete().eq('id',id);
  if(error)return toast('Lỗi: '+error.message);
  await logAct('Xóa',cfg.table,id,'');toast('Đã xóa ✓');renderModule(key);
}
function openQuickTT(id){
  const r=(MOD_STATE['accounts']||[]).find(x=>x.id===id);if(!r)return;
  FORM_CFG='accounts';FORM_ID=id;FORM_MODE='tt';

/* ============ EXCEL: template / export / import ============ */
function modCols(cfg){return cfg.fields.filter(f=>!(f.sensitive)).map(f=>f.l);}
function tplXlsx(key){
  const cfg=MODULES[key];if(!window.XLSX)return toast('Thư viện Excel chưa sẵn sàng');
  const head={};cfg.fields.forEach(f=>{
    let ex='';if(f.t==='sel')ex=f.opts.join(' / ');else if(f.t==='cat')ex=(catOpts(f.cat)||[]).join(' / ');else if(f.t==='date')ex='2026-06-01';else if(f.t==='num')ex='0';else if(f.t==='acc')ex='(tên TK)';
    head[f.l]=ex;});
  const ws=XLSX.utils.json_to_sheet([head]);const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Mau');XLSX.writeFile(wb,'RSA-mau-'+key+'.xlsx');
}
function exportXlsx(key){
  const cfg=MODULES[key];let rows=(MOD_STATE[key]||[]);
  if(ME.role==='SELLER'&&cfg.sellerScope)rows=rows.filter(r=>r[cfg.sellerScope]===ME.seller_name);
  const out=rows.map(r=>{const o={};cfg.fields.forEach(f=>{if(f.sensitive&&!['SD','PA'].includes(ME.role))return;let v=r[f.k];if(f.t==='acc')v=v?accLabel(v):'';o[f.l]=v??'';});return o;});
  if(!out.length)return toast('Chưa có dữ liệu để xuất');
  const ws=XLSX.utils.json_to_sheet(out);const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,cfg.title.slice(0,20));XLSX.writeFile(wb,'RSA-'+key+'-'+todayStr()+'.xlsx');
}
let IMP_ROWS=null, IMP_KEY=null;
async function importXlsx(key,file){
  if(!file)return;const cfg=MODULES[key];if(!window.XLSX)return toast('Thư viện Excel chưa sẵn sàng');
  const buf=await file.arrayBuffer();const wb=XLSX.read(new Uint8Array(buf),{type:'array',cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];const raw=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
  if(!raw.length)return toast('File trống');
  // (B) Cảnh báo nếu file không đúng cột của bảng này
  const fileHeaders=Object.keys(raw[0]||{});
  const matched=cfg.fields.filter(f=>fileHeaders.includes(f.l)).length;
  if(matched===0)return toast('File không khớp cột của bảng "'+cfg.title+'". Tải "Form mẫu" để lấy đúng cột.');
  const existing=MOD_STATE[key]||[];
  const norm=v=>String(v??'').trim().toLowerCase();
  const seenInFile=new Set();
  const parsed=raw.map((r,i)=>{
    const o={},errs=[];
    cfg.fields.forEach(f=>{
      let v=r[f.l];if(v===''||v==null){if(f.req)errs.push('thiếu '+f.l);o[f.k]=null;return;}
      if(f.t==='num')v=parseNumLoose(v,f.k);
      else if(f.t==='date'){const d=parseDateAny(v);if(!d&&v)errs.push('sai ngày '+f.l);v=d;}
      else if(f.t==='acc'){const a=ACCOUNTS.find(x=>x.name===String(v).trim()||(x.name+' ('+x.platform+')')===String(v).trim());if(!a)errs.push(f.l+' không tìm thấy TK');v=a?a.id:null;}
      else if((f.t==='sel'||f.t==='cat')){const opts=f.t==='cat'?catOpts(f.cat):f.opts;if(v&&!opts.includes(String(v).trim()))errs.push(f.l+' ngoài danh mục');v=String(v).trim();}
      o[f.k]=v;
    });
    // trùng khóa với dữ liệu hiện có (chuẩn hóa)
    if(cfg.key&&cfg.key.every(k=>String(o[k]??'').trim()!=='')){
      const sig=cfg.key.map(k=>norm(o[k])).join('||');
      if(seenInFile.has(sig))errs.push('trùng với dòng khác trong file'); // (C) trùng nội bộ file
      else seenInFile.add(sig);
      const dup=existing.find(e=>cfg.key.every(k=>norm(e[k])===norm(o[k])));
      if(dup)o._dup=dup.id;
    }
    o._row=i+2;o._errs=errs;
    return o;
  });
  IMP_ROWS=parsed;IMP_KEY=key;
  const okCount=parsed.filter(p=>!p._errs.length).length;
  const errCount=parsed.length-okCount;const dupCount=parsed.filter(p=>p._dup).length;
  $('impTitle').textContent='Nhập Excel · '+cfg.title;
  $('impBody').innerHTML=`<div style="margin-bottom:10px;font-size:13px">Đọc ${parsed.length} dòng · <b style="color:var(--green)">${okCount} hợp lệ</b> · <b style="color:var(--red)">${errCount} lỗi</b> · ${dupCount} trùng.</div>
    <table class="impTable"><thead><tr><th>Dòng</th><th>Tên/Nội dung</th><th>Trùng?</th><th>Kết quả kiểm tra</th></tr></thead><tbody>
    ${parsed.slice(0,200).map(p=>`<tr><td>${p._row}</td><td>${esc(p.name||p.content||p.gmail||p.batch_name||p.brand||p.llc_name||p.proxy_string||p.person||'')}</td>
      <td>${p._dup?'<span class="chip amber">trùng</span>':''}</td>
      <td>${p._errs.length?'<span class="impErr">'+esc(p._errs.join(', '))+'</span>':'<span class="chip green">OK</span>'}</td></tr>`).join('')}
    </tbody></table>`;
  $('impInfo').innerHTML=dupCount?`Dòng trùng sẽ: <select id="impDupMode"><option value="skip">Bỏ qua</option><option value="update">Cập nhật đè</option></select> <span class="muted" style="font-size:11px">("Cập nhật đè" ghi đè các ô CÓ điền trong file, trừ Trạng thái & khóa; ô để trống giữ nguyên)</span>`:'';
  $('impModal').classList.add('show');
}
$('impCommit').onclick=async()=>{
  const cfg=MODULES[IMP_KEY];const dupMode=$('impDupMode')?.value||'skip';
  const good=IMP_ROWS.filter(p=>!p._errs.length);
  const existMap={};(MOD_STATE[IMP_KEY]||[]).forEach(r=>existMap[r.id]=r);
  const labelOf={};cfg.fields.forEach(f=>labelOf[f.k]=f.l);
  let ins=0,upd=0,same=0,skip=0;const fails=[],changes=[];
  $('impCommit').disabled=true;
  for(const p of good){
    if(p._dup){
      if(dupMode==='skip'){skip++;continue;}
      const patch={};cfg.fields.forEach(f=>{if(p[f.k]!=null&&p[f.k]!=='')patch[f.k]=p[f.k];});
      if(cfg.table==='accounts')delete patch.status; // trạng thái đổi qua nút riêng để giữ log
      cfg.key.forEach(k=>delete patch[k]); // không đụng khóa
      // SO SÁNH THẬT: chỉ giữ cột thực sự khác dữ liệu hiện tại
      const ex=existMap[p._dup]||{};const diff={};
      Object.keys(patch).forEach(k=>{if(String(ex[k]??'')!==String(patch[k]??''))diff[k]=patch[k];});
      if(!Object.keys(diff).length){same++;continue;} // trùng y hệt → không đè
      const {error}=await sb.from(cfg.table).update(diff).eq('id',p._dup);
      if(error){fails.push(`Dòng ${p._row}: ${error.message}`);}
      else{upd++;changes.push({row:p._row,name:p.name||p.content||p.gmail||p.batch_name||p.brand||p.llc_name||p.person||p.login_id||('#'+p._dup),
        fields:Object.keys(diff).map(k=>`${labelOf[k]||k}: "${esc(String(ex[k]??''))}"→"${esc(String(diff[k]??''))}"`)});}
    }else{
      const payload={};cfg.fields.forEach(f=>{if(p[f.k]!=null&&p[f.k]!=='')payload[f.k]=p[f.k];});
      if(cfg.userCol)payload[cfg.userCol]=ME.id;
      const {error}=await sb.from(cfg.table).insert(payload);
      if(error){fails.push(`Dòng ${p._row}: ${error.code==='23505'?'trùng khóa (DB chặn) — chọn Cập nhật đè':error.message}`);}
      else ins++;
    }
  }
  await logAct('Nhập Excel',cfg.table,cfg.title,`thêm ${ins}, cập nhật ${upd}, trùng y hệt ${same}, bỏ qua ${skip}, lỗi ${fails.length}`);
  $('impCommit').disabled=false;
  $('impInfo').innerHTML='';
  const statusNote=cfg.table==='accounts'?'<div class="muted" style="font-size:11.5px;margin-top:8px">Lưu ý: import KHÔNG đổi cột Trạng thái (đổi qua nút "Đổi trạng thái" để giữ lịch sử).</div>':'';
  let panel=`<div style="margin-bottom:10px;font-size:13px"><b style="color:var(--green)">+${ins} mới</b> · <b style="color:var(--blue)">${upd} cập nhật</b> · ${same} trùng y hệt (bỏ qua) · ${skip} bỏ qua · <b style="color:var(--red)">${fails.length} lỗi</b></div>`;
  if(!upd&&!ins&&same){panel+=`<div class="card" style="background:rgba(242,193,78,.1);border-color:rgba(242,193,78,.3)">Tất cả dòng trùng có nội dung <b>y hệt dữ liệu hiện tại</b> nên không có gì để ghi đè. Muốn thấy thay đổi, sửa giá trị trong file Excel rồi nhập lại.${statusNote}</div>`;}
  if(changes.length){panel+=`<div class="card" style="margin-top:8px"><b>Đã ghi đè ${changes.length} dòng — chi tiết:</b><ul style="margin:8px 0 0 16px;font-size:12px;line-height:1.7">${changes.slice(0,50).map(c=>`<li><b>${esc(c.name)}</b> (dòng ${c.row}): ${c.fields.join(' · ')}</li>`).join('')}</ul>${statusNote}</div>`;}
  if(fails.length){panel+=`<div class="card" style="margin-top:8px;background:rgba(240,106,106,.08);border-color:rgba(240,106,106,.3)"><b style="color:var(--red)">Các dòng lỗi (chưa nhập):</b><ul style="margin:8px 0 0 16px;font-size:12px;line-height:1.7">${fails.slice(0,40).map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>`;}
  if(ins&&!upd&&!fails.length&&!same){$('impModal').classList.remove('show');toast(`Nhập xong: +${ins} mới`);}
  else{$('impBody').innerHTML=panel;}
  toast(`+${ins} mới · ${upd} cập nhật · ${same} trùng · ${fails.length} lỗi`);
  renderModule(IMP_KEY);
};

let _trendChart=null;
function drawTrend(snaps){
  const rows=(snaps||[]).slice().sort((a,b)=>a.week_start<b.week_start?-1:1);
  const empty=$('trendEmpty'),cv=$('trendChart');
  if(rows.length<2){if(empty)empty.style.display='block';if(cv)cv.style.display='none';return;}
  if(empty)empty.style.display='none';if(cv)cv.style.display='block';
  const labels=rows.map(s=>s.week_start.slice(5));
  const total=rows.map(s=>num(s.tts_active)+num(s.amz_active)+num(s.etsy_active)+num(s.other_active));
  const muted=getComputedStyle(document.body).getPropertyValue('--muted').trim()||'#8b92a7';
  const ds=(lbl,key,col)=>({label:lbl,data:rows.map(s=>num(s[key])),borderColor:col,backgroundColor:col,tension:.3,pointRadius:3});
  if(_trendChart)_trendChart.destroy();
  _trendChart=new Chart(cv,{type:'line',
    data:{labels,datasets:[{label:'Tổng active',data:total,borderColor:'#3ecf8e',backgroundColor:'#3ecf8e',tension:.3,pointRadius:3,borderWidth:2},
      ds('TTS','tts_active','#5b8cff'),ds('AMZ','amz_active','#f2c14e'),ds('Etsy','etsy_active','#9b7bff'),ds('Die/Susp','die_total','#f06a6a')]},
    options:{plugins:{legend:{labels:{color:muted,boxWidth:12,font:{size:11}}}},scales:{x:{ticks:{color:muted},grid:{display:false}},y:{ticks:{color:muted},grid:{color:'rgba(128,128,128,.12)'}}}}});
}
function dashDrill(code,val){
  const A=window._dashAccs||[];let list=[],title='';
  const ACT=x=>x.status==='Active',DEAD=x=>['Die','Suspend'].includes(x.status);
  if(code==='all'){list=A;title='Tất cả tài khoản';}
  else if(code==='aTTS'||code==='aAMZ'||code==='aEtsy'){const p=code.slice(1);list=A.filter(x=>ACT(x)&&x.platform===p);title=p+' đang Active';}
  else if(code==='dead'){list=A.filter(DEAD);title='TK Die / Suspend';}
  else if(code==='sel_a'){list=A.filter(x=>x.seller===val&&ACT(x));title=val+' · Active';}
  else if(code==='sel_d'){list=A.filter(x=>x.seller===val&&['Die','Suspend','Thu hồi'].includes(x.status));title=val+' · Die/Suspend/Thu hồi';}
  else if(code==='sel_cap'){list=A.filter(x=>x.seller===val&&(ACT(x)||['Die','Suspend','Thu hồi'].includes(x.status)));title=val+' · Đã cấp';}
  else if(code==='sel_all'){list=A.filter(x=>x.seller===val);title=val+' · Tất cả TK';}
  else if(code==='src_a'){list=A.filter(x=>x.source===val&&ACT(x));title='Nguồn '+val+' · Active';}
  else if(code==='src_all'){list=A.filter(x=>x.source===val);title='Nguồn '+val+' · Tất cả';}
  else if(code==='bal_active'){list=A.filter(x=>ACT(x)&&num(x.balance_usd)>0).sort((a,b)=>num(b.balance_usd)-num(a.balance_usd));title='TK active có balance';}
  else if(code==='hold_all'){list=A.filter(x=>num(x.onhold_usd)>0).sort((a,b)=>num(b.onhold_usd)-num(a.onhold_usd));title='TK có tiền treo on-hold';}
  else if(code==='hold_risk'){list=A.filter(x=>DEAD(x)&&num(x.onhold_usd)>0).sort((a,b)=>num(b.onhold_usd)-num(a.onhold_usd));title='Tiền treo ở TK khóa — nguy cơ mất';}
  else if(code==='neg'){list=A.filter(x=>num(x.negative_usd)>0).sort((a,b)=>num(b.negative_usd)-num(a.negative_usd));title='TK có negative balance (nợ)';}
  const money=['bal_active','hold_all','hold_risk','neg'].includes(code);
  const sumHold=list.reduce((s,a)=>s+num(a.onhold_usd),0),sumBal=list.reduce((s,a)=>s+num(a.balance_usd),0),sumNeg=list.reduce((s,a)=>s+num(a.negative_usd),0);
  $('drillTitle').textContent=title+' — '+list.length+' TK'+(money?` · on-hold $${fmtUsd(sumHold)} · balance $${fmtUsd(sumBal)}`:'');
  $('drillBody').innerHTML=list.length?
    `<table><thead><tr><th>Tên TK</th><th>Sàn</th><th>Seller</th><th>Trạng thái</th>${money?'<th class="num">On-hold ($)</th><th class="num">Balance ($)</th>':'<th>Nguồn</th><th>Lỗi</th>'}</tr></thead><tbody>${
      list.map(a=>`<tr><td>${esc(a.name)}</td><td>${a.platform}</td><td>${esc(a.seller)}</td><td>${badge(MODULES.accounts,'status',a.status)}</td>${money?`<td class="num"><b>${fmtUsd(a.onhold_usd)}</b></td><td class="num">${fmtUsd(a.balance_usd)}</td>`:`<td>${esc(a.source||'')}</td><td class="muted">${esc((a.error_type||'').slice(0,30))}</td>`}</tr>`).join('')
    }</tbody></table><div style="margin-top:12px;text-align:right"><button class="btn ghost sm" onclick="$('drillModal').classList.remove('show');go('accounts')">Mở trang Tài khoản ›</button></div>`
    :'<div class="empty">Không có TK nào trong nhóm này.</div>';
  $('drillModal').classList.add('show');
}
function expInPeriod(e,p){
  const d=new Date(e.expense_date),now=new Date();
  if(p==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
  if(p==='30')return (now-d)/86400000<=30&&d<=now;
  if(p==='quarter')return d.getFullYear()===now.getFullYear()&&Math.floor(d.getMonth()/3)===Math.floor(now.getMonth()/3);
  if(p==='year')return d.getFullYear()===now.getFullYear();
  return true;
}
const EXP_COLORS=['#3ecf8e','#5b8cff','#f2c14e','#f06a6a','#9b7bff','#56b6c2','#e0664a','#8b92a7'];

  if(!$('expChart'))return;

  const sums={};exps.forEach(e=>{const g=e.group_name||'Khác';sums[g]=(sums[g]||0)+num(e.amount_vnd);});
  const pairs=Object.entries(sums).sort((a,b)=>b[1]-a[1]);
  const total=pairs.reduce((s,x)=>s+x[1],0);
  $('expTotalTag').textContent='Tổng: '+fmtVnd(total)+'₫';
  $('expChartEmpty').style.display=pairs.length?'none':'block';
  $('expChart').style.display=pairs.length?'block':'none';
  $('expTable').innerHTML=pairs.length?`<table><thead><tr><th>Nhóm</th><th class="num">Số tiền (₫)</th><th class="num">%</th></tr></thead><tbody>${pairs.map(([g,v],i)=>`<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${EXP_COLORS[i%EXP_COLORS.length]};margin-right:6px"></span>${esc(g)}</td><td class="num">${fmtVnd(v)}</td><td class="num">${total?Math.round(v/total*100):0}%</td></tr>`).join('')}<tr><td><b>Tổng</b></td><td class="num"><b>${fmtVnd(total)}</b></td><td class="num">100%</td></tr></tbody></table>`:'<div class="empty">Chưa có dữ liệu.</div>';
  if(window._expChart){window._expChart.destroy();window._expChart=null;}
  if(!pairs.length||!window.Chart)return;
  const muted=getComputedStyle(document.body).getPropertyValue('--muted').trim()||'#8b92a7';
  const txtColor=getComputedStyle(document.body).getPropertyValue('--text').trim()||'#e6e8ee';
  window._expChart=new Chart($('expChart'),{type:'bar',
    data:{labels:pairs.map(x=>x[0]),datasets:[{data:pairs.map(x=>x[1]),backgroundColor:pairs.map((_,i)=>EXP_COLORS[i%EXP_COLORS.length]),borderRadius:6}]},
    options:{indexAxis:'y',layout:{padding:{right:84}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtVnd(c.raw)+'₫'}}},
      scales:{x:{ticks:{color:muted,callback:v=>v>=1e6?(v/1e6)+'tr':fmtVnd(v)},grid:{color:'rgba(128,128,128,.12)'}},y:{ticks:{color:muted},grid:{display:false}}}},
    plugins:[{id:'barLabels',afterDatasetsDraw(chart){
      const ctx=chart.ctx;ctx.save();ctx.font='600 11px -apple-system,Segoe UI,Roboto,Arial,sans-serif';ctx.textBaseline='middle';
      chart.getDatasetMeta(0).data.forEach((bar,i)=>{
        const v=chart.data.datasets[0].data[i];const lbl=fmtVnd(v);
        const w=ctx.measureText(lbl).width;
        let x=bar.x+6;
        if(x+w>chart.chartArea.right+80)x=chart.chartArea.right+80-w;
        ctx.fillStyle=txtColor;ctx.fillText(lbl,x,bar.y);
      });ctx.restore();
    }}]});
}

/* ============ THÔNG BÁO (feed chéo bộ phận, suy từ cases + status_log + requests) ============ */
async function buildNotiItems(){
  const [caseR,logR,reqR,accR]=await Promise.all([
    sb.from('cases').select('id,account_id,seller,error_type,status,created_at,created_by').order('created_at',{ascending:false}).limit(60),
    sb.from('account_status_log').select('id,account_id,old_status,new_status,changed_by_name,changed_at').order('changed_at',{ascending:false}).limit(60),
    sb.from('account_requests').select('*').order('id',{ascending:false}).limit(60),
    sb.from('accounts').select('id,name,platform,seller')]);
  const accMap={};(accR.data||[]).forEach(a=>accMap[a.id]=a);
  const nm=id=>{const a=accMap[id];return a?a.name+' ('+a.platform+')':'TK #'+id;};
  const items=[];const r=ME.role;
  const since=Date.now()-30*86400000;
  // 1) CASE — seller báo lỗi / case mới. Bộ phận nhận: PA, Media, SD, QL + seller chủ TK
  (caseR.data||[]).forEach(c=>{
    if(new Date(c.created_at).getTime()<since)return;
    const care=['SD','QL','PA','FFM','SELLER'];if(!care.includes(r))return;
    items.push({key:'case:'+c.id,cat:'Seller báo lỗi',src:'cases',acc:c.account_id,ic:'⚠',lv:['Thất bại','Dừng'].includes(c.status)?'hi':'mid',
      t:`Báo lỗi TK ${nm(c.account_id)}`,w:`${c.seller||''} · ${c.error_type||''} · ${c.status}`,ts:c.created_at});
  });
  // 2) LOG đổi trạng thái. Media + Seller + PA/QL/SD
  (logR.data||[]).forEach(l=>{
    if(new Date(l.changed_at).getTime()<since)return;
    const risk=['Die','Suspend'].includes(l.new_status);
    if(r==='FFM'&&!risk&&l.new_status!=='Active')return; // Media chỉ quan tâm khóa/hồi
    items.push({key:'slog:'+l.id,cat:risk?'TK bị khóa/lỗi':(l.new_status==='Active'?'TK hoạt động lại':'Đổi trạng thái khác'),src:'accounts',acc:l.account_id,
      ic:risk?'🔴':(l.new_status==='Active'?'🟢':'🔵'),lv:risk?'hi':'lo',
      t:`TK ${nm(l.account_id)}: ${l.old_status||'?'} → ${l.new_status}`,
      w:risk?(r==='FFM'?'Media dừng làm video kênh này':'Cần xử lý'):(l.new_status==='Active'?(r==='FFM'?'Media làm video lại':'TK hoạt động lại'):''),
      by:l.changed_by_name,ts:l.changed_at});
  });
  // 3) YÊU CẦU CẤP TK. created→PA/QL/SD ; quyết định/cấp→Seller + PA
  (reqR.data||[]).forEach(q=>{
    const created=q.created_at||q.request_date;
    if(created&&new Date(created).getTime()>=since&&['SD','QL','PA'].includes(r))
      items.push({key:'reqnew:'+q.id,cat:'Yêu cầu cấp TK',src:'requests',ic:'✉',lv:'lo',t:`Yêu cầu cấp TK: ${q.seller}`,w:`${q.account_type} · ${q.reason||''}`,ts:created});
    if(q.approval_status&&q.approval_status!=='Chờ duyệt'&&q.approved_at){
      if(['SD','QL','PA','SELLER'].includes(r))
        items.push({key:'reqdec:'+q.id+':'+q.approval_status,cat:'Kết quả duyệt yêu cầu',src:'requests',ic:q.approval_status==='Đã duyệt'?'✅':'❌',lv:'lo',
          t:`Yêu cầu của ${q.seller} · ${q.approval_status}`,w:q.reject_reason||q.account_type,ts:q.approved_at});
    }
    if(q.issue_status==='Đã cấp'&&['SELLER','PA'].includes(r))
      items.push({key:'reqiss:'+q.id,cat:'Đã cấp TK',src:'requests',ic:'🎁',lv:'lo',t:`Đã cấp TK cho ${q.seller}`,w:q.issued_date||'',ts:q.issued_date||q.approved_at});
  });
  items.sort((a,b)=>new Date(b.ts||0)-new Date(a.ts||0));
  return items;
}
const NOTI_CAT_ORDER=['TK bị khóa/lỗi','Seller báo lỗi','TK hoạt động lại','Yêu cầu cấp TK','Kết quả duyệt yêu cầu','Đã cấp TK','Đổi trạng thái khác'];
function notiHtml(a,i){const seen=SEEN.has(a.key);const srcL=SRC_LABEL[a.src]||'';

async function renderNoti(){
  $('pageArea').innerHTML=`<div class="topbar"><div><h1>Thông báo</h1><div class="sub">Việc liên quan bộ phận của bạn · gom theo loại · 30 ngày gần nhất</div></div>

  const cats=[...NOTI_CAT_ORDER,...[...new Set(items.map(a=>a.cat))].filter(c=>!NOTI_CAT_ORDER.includes(c))];
  let html='';
  cats.forEach(cat=>{const arr=items.filter(a=>a.cat===cat);if(!arr.length)return;

    html+=arr.map(a=>notiHtml(a,idx.get(a))).join('');});
  $('notiList').innerHTML=html;
  updateNotiBadge(items);
}
async function markNoti(el,i){const a=(window._notis||[])[i];if(!a)return;SEEN.add(a.key);const card=el.closest('.alert');if(card)card.classList.add('seen');el.textContent='✓ đã đọc';try{await sb.from('alert_seen').insert({alert_key:a.key.slice(0,300),user_id:ME.id});}catch(e){}updateNotiBadge(window._notis);}
async function markAllNoti(){for(const a of (window._notis||[])){if(!SEEN.has(a.key)){SEEN.add(a.key);try{await sb.from('alert_seen').insert({alert_key:a.key.slice(0,300),user_id:ME.id});}catch(e){}}}renderNoti();toast('Đã đánh dấu tất cả đã đọc ✓');}
function updateNotiBadge(items){const cnt=(items||[]).filter(a=>!SEEN.has(a.key)).length;const b=$('navNoti');if(b){b.textContent=cnt;b.style.display=cnt?'inline-block':'none';}}
async function refreshNotiBadge(){try{await loadSeen();const items=await buildNotiItems();updateNotiBadge(items);}catch(e){}}

/* ============ CẢNH BÁO ============ */
async function computeAlerts(){
  const [accR,caseR,reqR,proxR,toolR,llcR]=await Promise.all([
    sb.from('accounts').select('*'),sb.from('cases').select('*'),sb.from('account_requests').select('*'),
    sb.from('proxies').select('*'),sb.from('tool_accounts').select('*'),sb.from('llcs').select('*')]);
  const accs=accR.data||[],cases=caseR.data||[],reqs=reqR.data||[],prox=proxR.data||[],tools=toolR.data||[],llcs=llcR.data||[];
  const A=[];const D=(k,b)=>daysBetween(b||todayStr(),k);
  const NOTSELLER=['Chưa phân','Thu hồi',''];
  const push=(o)=>A.push(o);
  accs.forEach(a=>{if(['Die','Suspend'].includes(a.status)&&a.status_changed_at&&daysBetween(a.status_changed_at)<=1)push({lv:'hi',cat:'Vừa khóa',src:'accounts',acc:a.id,ic:'🔴',t:`TK ${a.name} chuyển ${a.status} trong 24h`,w:`seller ${a.seller} · lỗi ${a.error_type||'?'}`});
    if(['Die','Suspend'].includes(a.status)&&num(a.onhold_usd)>500)push({lv:'hi',cat:'Tiền treo ở TK khóa',src:'accounts',acc:a.id,ic:'💰',t:`TK ${a.name} khóa — $${fmtUsd(a.onhold_usd)} on-hold`,w:`seller ${a.seller} · nguy cơ mất tiền`});});
  const sellers=[...new Set(accs.map(a=>a.seller).filter(s=>s&&!NOTSELLER.includes(s)))];
  sellers.forEach(s=>{const list=accs.filter(a=>a.seller===s);const act=list.filter(x=>x.status==='Active').length;const tot=list.filter(x=>['Active','Die','Suspend','Thu hồi'].includes(x.status)).length;if(tot>=3){const r=Math.round(act/tot*100);if(r<60)push({lv:'mid',cat:'Tỷ lệ giữ TK thấp',src:'accounts',ic:'📉',t:`${s} giữ TK ${r}%`,w:`${act}/${tot} còn active`});}});
  cases.forEach(c=>{if(['Pending','Đang xử lý'].includes(c.status)){const d=daysBetween(c.date_start);if(d>3&&!c.date_appeal)push({lv:'mid',cat:'Case tồn chưa xử',src:'cases',acc:c.account_id,ic:'⚖',t:`Case ${accLabel(c.account_id)} tồn ${d} ngày`,w:`${c.error_type||''} · chưa gửi kháng`});}});
  reqs.forEach(r=>{if(r.approval_status==='Chờ duyệt'){const d=daysBetween(r.request_date);if(d>2)push({lv:'lo',cat:'Yêu cầu chờ duyệt',src:'requests',ic:'✉',t:`${r.seller} yêu cầu cấp TK`,w:`chờ ${d} ngày · ${r.account_type}`});}});
  prox.forEach(p=>{if(p.status==='Active'&&p.date_end){const d=D(p.date_end);if(d>=0&&d<=7)push({lv:'mid',cat:'Sắp hết hạn',src:'proxies',ic:'⇄',t:`Proxy ${p.profile_name||p.proxy_string} hết hạn`,w:`còn ${d} ngày · ${p.vendor||''}`});}});
  tools.forEach(t=>{if(t.status!=='Dừng'&&t.renew_date){const d=D(t.renew_date);if(d>=0&&d<=7)push({lv:'mid',cat:'Sắp hết hạn',src:'tool_accounts',ic:'⚙',t:`Tool ${t.tool_type} đến hạn gia hạn`,w:`còn ${d} ngày · ${t.mail||''}`});}});
  accs.forEach(a=>{if(a.warranty_end){const d=D(a.warranty_end);if(d>=0&&d<=5)push({lv:'mid',cat:'Sắp hết hạn',src:'accounts',acc:a.id,ic:'🛡',t:`TK ${a.name} hết bảo hành`,w:`còn ${d} ngày · seller ${a.seller}`});}
    if(a.phone_change_due){const d=D(a.phone_change_due);if(d>=0&&d<=7)push({lv:'lo',cat:'Sắp hết hạn',src:'accounts',acc:a.id,ic:'📱',t:`TK ${a.name} đến hạn thay phone`,w:`còn ${d} ngày`});}});
  llcs.forEach(l=>{if(l.end_date){const d=D(l.end_date);if(d>=0&&d<=30)push({lv:'lo',cat:'Sắp hết hạn',src:'llcs',ic:'§',t:`LLC ${l.llc_name} hết hạn`,w:`còn ${d} ngày · ${l.owner_name}`});}});
  try{
    const {data:snaps}=await sb.from('weekly_snapshots').select('*').order('week_start');
    const wk=mondayOf(new Date());const prev=(snaps||[]).filter(s=>s.week_start<wk).pop();
    if(prev){const prevTot=num(prev.tts_active)+num(prev.amz_active)+num(prev.etsy_active)+num(prev.other_active);
      const curTot=accs.filter(a=>a.status==='Active').length;
      if(prevTot-curTot>3)push({lv:'hi',cat:'Biến động',src:'accounts',ic:'📉',t:`Tổng active giảm ${prevTot-curTot} TK so tuần trước`,w:`${prevTot} → ${curTot}`});}
  }catch(e){}
  A.forEach(a=>a.key=a.t);
  const order={hi:0,mid:1,lo:2};A.sort((x,y)=>order[x.lv]-order[y.lv]);
  return A;
}
const CAT_ORDER=['Tiền treo ở TK khóa','Vừa khóa','Biến động','Case tồn chưa xử','Tỷ lệ giữ TK thấp','Sắp hết hạn','Yêu cầu chờ duyệt'];
const SRC_LABEL={accounts:'Tài khoản',cases:'Case kháng',requests:'Yêu cầu cấp TK',proxies:'Proxy',tool_accounts:'TK công cụ',llcs:'LLC'};
let SEEN=new Set();

async function loadSeen(){const {data}=await sb.from('alert_seen').select('alert_key').eq('user_id',ME.id);SEEN=new Set((data||[]).map(x=>x.alert_key));}
function updateAlertBadge(al){const cnt=(al||[]).filter(a=>!SEEN.has(a.key)).length;const b=$('navAlerts');if(b){b.textContent=cnt;b.style.display=cnt?'inline-block':'none';}}
async function renderAlerts(){
  $('pageArea').innerHTML=`<div class="topbar"><div><h1>Cảnh báo</h1><div class="sub">Tự sinh từ dữ liệu · gom theo loại · bấm "Mở ›" để tới đúng chỗ xử lý</div></div>

  });
  $('alertList').innerHTML=html;
  updateAlertBadge(al);

  const sellers=catOpts('seller');
  const roleSel=p=>`<select id="role_${p.id}">${['SELLER','FFM','PA','QL','SD'].map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${rlabel(r)}</option>`).join('')}</select>`;
  const sellerSel=p=>`<select id="seller_${p.id}"><option value="">— seller —</option>${sellers.map(s=>`<option ${p.seller_name===s?'selected':''}>${esc(s)}</option>`).join('')}</select>`;
  const pend=(profs||[]).filter(p=>p.status==='pending');
  $('pendList').innerHTML=pend.length?`<div class="tbl-wrap"><table><thead><tr><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Seller</th><th></th></tr></thead><tbody>${pend.map(p=>`<tr><td>${esc(p.full_name)}</td><td>${esc(p.email)}</td><td>${roleSel(p)}</td><td>${sellerSel(p)}</td><td><button class="btn sm" onclick="approveUser('${p.id}')">Duyệt</button></td></tr>`).join('')}</tbody></table></div>`:'Không có đăng ký chờ duyệt.';
  const appr=(profs||[]).filter(p=>p.status!=='pending');
  $('apprList').innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Seller</th><th>Trạng thái</th><th></th></tr></thead><tbody>${appr.map(p=>`<tr><td>${esc(p.full_name)}</td><td>${esc(p.email)}</td><td>${roleSel(p)}</td><td>${sellerSel(p)}</td><td>${p.status==='approved'?'<span class="chip green">Hoạt động</span>':'<span class="chip red">Khóa</span>'}</td><td style="white-space:nowrap"><button class="btn ghost sm" onclick="saveUser('${p.id}')">Lưu</button> ${p.id===ME.id?'':(p.status==='approved'?`<button class="btn danger sm" onclick="lockUser('${p.id}',true)">Khóa</button>`:`<button class="btn sm" onclick="lockUser('${p.id}',false)">Mở</button>`)}</td></tr>`).join('')}</tbody></table></div>`;
}
async function saveMenuPerms(){
  const items=NAV.filter(n=>!n.sec&&n.key!=='perms'&&n.key!=='log');
  const rows=[];
  for(const [c] of MATRIX_ROLES)for(const n of items){
    const el=$('mp_'+c+'_'+n.key);if(el)rows.push({role:c,menu_key:n.key,allowed:el.checked});
  }
  const {error}=await sb.from('menu_permissions').upsert(rows,{onConflict:'role,menu_key'});
  if(error)return toast('Lỗi: '+error.message);
  await logAct('Lưu quyền menu','menu_permissions','',rows.length+' dòng');
  await loadMenuPerms();buildNav();toast('Đã lưu phân quyền ✓');
}
async function approveUser(id){const role=$('role_'+id).value,seller=$('seller_'+id).value;if(role==='SELLER'&&!seller)return toast('Seller phải chọn tên seller');const {error}=await sb.from('profiles').update({role,seller_name:role==='SELLER'?seller:null,status:'approved'}).eq('id',id);if(error)return toast('Lỗi: '+error.message);await logAct('Duyệt user','profiles',id,role);toast('Đã duyệt ✓');renderPerms();}
async function saveUser(id){const role=$('role_'+id).value,seller=$('seller_'+id).value;if(role==='SELLER'&&!seller)return toast('Seller phải chọn tên seller');const {error}=await sb.from('profiles').update({role,seller_name:role==='SELLER'?seller:null}).eq('id',id);if(error)return toast('Lỗi: '+error.message);await logAct('Sửa vai trò','profiles',id,role);toast('Đã lưu ✓');renderPerms();}
async function lockUser(id,lock){const {error}=await sb.from('profiles').update({status:lock?'locked':'approved'}).eq('id',id);if(error)return toast('Lỗi: '+error.message);await logAct(lock?'Khóa':'Mở','profiles',id,'');renderPerms();}

/* ============ DANH MỤC ============ */
const CAT_GROUPS=[['seller','Seller'],['trang_thai_tk','Trạng thái TK'],['nguon_tk','Nguồn TK'],['nhom_chi_phi','Nhóm chi phí'],['loai_loi','Loại lỗi'],['noi_mua','Nơi mua'],['loai_tool','Loại tool']];
let catGroup='seller';
async function renderCats(){
  $('pageArea').innerHTML=`<div class="topbar"><div><h1>Danh mục</h1><div class="sub">Dropdown toàn hệ thống. Người nghỉ → Tắt, đừng xóa (giữ lịch sử).</div></div></div>
    <div class="filters">${CAT_GROUPS.map(([k,l])=>`<button class="btn ${k===catGroup?'':'ghost'} sm" onclick="catGroup='${k}';renderCats()">${l}</button>`).join('')}</div>
    <div class="card"><div class="filters"><input class="search" id="newCat" placeholder="Thêm giá trị mới..." style="max-width:240px"><button class="btn sm" onclick="addCat()">+ Thêm</button></div><div id="catList" class="muted">Đang tải...</div></div>`;
  const {data}=await sb.from('categories').select('*').eq('group_name',catGroup).order('sort').order('value');
  const isSeller=catGroup==='seller';
  $('catList').innerHTML=(data&&data.length)?`<div class="tbl-wrap"><table><thead><tr><th>Giá trị</th><th>Trạng thái</th>${isSeller?'<th class="num">TK đang gắn</th>':''}<th></th></tr></thead><tbody>${data.map(c=>`<tr><td>${esc(c.value)}</td><td>${c.active?'<span class="chip green">Đang dùng</span>':'<span class="chip mut">Tắt</span>'}</td>${isSeller?`<td class="num" id="scnt_${c.id}" class="muted">·</td>`:''}<td style="white-space:nowrap">${isSeller?`<button class="btn ghost sm" onclick="renameSeller('${esc(c.value)}')">Đổi tên / gộp</button> `:''}<button class="btn ghost sm" onclick="toggleCat(${c.id},${!c.active})">${c.active?'Tắt':'Bật'}</button> ${ME.role==='SD'?`<button class="btn danger sm" onclick="delCat(${c.id},'${esc(c.value)}')">Xóa</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'Chưa có giá trị.';
  if(isSeller){const {data:accs}=await sb.from('accounts').select('seller');const cnt={};(accs||[]).forEach(a=>{cnt[a.seller]=(cnt[a.seller]||0)+1;});data.forEach(c=>{const el=$('scnt_'+c.id);if(el)el.textContent=cnt[c.value]||0;});}
}
async function renameSeller(oldName){
  const nw=prompt(`Đổi seller "${oldName}" thành (hoặc gộp vào tên đã có):`,oldName);
  if(nw===null)return;const newName=nw.trim();if(!newName||newName===oldName)return;
  if(!confirm(`Đổi TẤT CẢ dữ liệu có seller "${oldName}" → "${newName}"?\n(Áp cho: Tài khoản, Case, Yêu cầu, TK phân quyền, và user seller đang gán). Không hoàn tác được.`))return;
  try{
    await sb.from('accounts').update({seller:newName}).eq('seller',oldName);
    await sb.from('cases').update({seller:newName}).eq('seller',oldName);
    await sb.from('account_requests').update({seller:newName}).eq('seller',oldName);
    await sb.from('sub_accounts').update({granted_to:newName}).eq('granted_to',oldName);
    await sb.from('profiles').update({seller_name:newName}).eq('seller_name',oldName);
    // danh mục: nếu newName đã tồn tại thì xóa dòng cũ, ngược lại đổi tên dòng cũ
    const {data:ex}=await sb.from('categories').select('id').eq('group_name','seller').eq('value',newName).maybeSingle();
    if(ex){await sb.from('categories').delete().eq('group_name','seller').eq('value',oldName);}
    else{await sb.from('categories').update({value:newName}).eq('group_name','seller').eq('value',oldName);}
    await logAct('Đổi tên seller','categories',oldName+' → '+newName,'');
    await loadCats();toast(`Đã đổi "${oldName}" → "${newName}" trên toàn bộ dữ liệu ✓`);renderCats();
  }catch(e){toast('Lỗi: '+e.message);}
}
async function addCat(){const v=$('newCat').value.trim();if(!v)return;const {error}=await sb.from('categories').insert({group_name:catGroup,value:v});if(error)return toast(error.code==='23505'?'Đã tồn tại':'Lỗi: '+error.message);await loadCats();renderCats();}
async function toggleCat(id,a){await sb.from('categories').update({active:a}).eq('id',id);await loadCats();renderCats();}
async function delCat(id,v){if(!confirm('Xóa "'+v+'"? Nên Tắt nếu đã dùng.'))return;await sb.from('categories').delete().eq('id',id);await loadCats();renderCats();}

/* ============ NHẬT KÝ ============ */
async function renderLog(){
  $('pageArea').innerHTML=`<div class="topbar"><div><h1>Nhật ký</h1><div class="sub">200 dòng gần nhất · chỉ SD xem</div></div></div><div class="card"><div id="logList" class="muted">Đang tải...</div></div>`;
  const {data}=await sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(200);
  $('logList').innerHTML=(data&&data.length)?`<div class="tbl-wrap"><table><thead><tr><th>Thời gian</th><th>Người</th><th>Hành động</th><th>Đối tượng</th><th>Chi tiết</th></tr></thead><tbody>${data.map(l=>`<tr><td>${new Date(l.created_at).toLocaleString('vi-VN')}</td><td>${esc(l.user_name)}</td><td><span class="chip blue">${esc(l.action)}</span></td><td>${esc(l.target_table||'')} ${esc(l.target_label||'')}</td><td>${esc(l.detail||'')}</td></tr>`).join('')}</tbody></table></div>`:'Chưa có hoạt động.';
}

/* ============ HỒ SƠ ============ */
async function renderProfile(){
  $('pageArea').innerHTML=`<div class="topbar"><div><h1>Hồ sơ</h1></div></div>
    <div class="card" style="max-width:440px">
      <div class="formgrid" style="padding:0;grid-template-columns:1fr">
        <div class="fld"><label>Email</label><div>${esc(ME.email)}</div></div>
        <div class="fld"><label>Vai trò</label><div><span class="chip green">${rlabel(ME.role)}</span> ${ME.seller_name?'· '+esc(ME.seller_name):''}</div></div>
        <div class="fld"><label>Tên hiển thị</label><input id="pfName" value="${esc(ME.full_name||'')}"></div>
      </div>
      <button class="btn" style="margin-top:14px" onclick="saveProfile()">Lưu hồ sơ</button>
    </div>`;
}
async function saveProfile(){const {error}=await sb.from('profiles').update({full_name:$('pfName').value.trim()}).eq('id',ME.id);if(error)return toast('Lỗi: '+error.message);ME.full_name=$('pfName').value.trim();$('uName').textContent=ME.full_name;toast('Đã lưu ✓');}

boot();
</script>
