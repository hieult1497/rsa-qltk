<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSA QLTK — Quản lý tài khoản</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--bg:#0f1117;--panel:#171a23;--panel2:#1e2230;--line:#2a2f3e;--text:#e6e8ee;--muted:#8b92a7;
    --brand:#3ecf8e;--brand2:#2fae77;--green:#3ecf8e;--amber:#f2c14e;--red:#f06a6a;--blue:#5b8cff;--purple:#9b7bff;--radius:12px;}
  body.t-dark{--bg:#0f1117;--panel:#171a23;--panel2:#1e2230;--line:#2a2f3e;--text:#e6e8ee;--muted:#8b92a7;--brand:#3ecf8e;--brand2:#2fae77;}
  body.t-light{--bg:#f4f3ee;--panel:#ffffff;--panel2:#faf9f5;--line:#e5e4dd;--text:#1a1a18;--muted:#6b6a64;--brand:#0f6e56;--brand2:#0c5a47;--green:#0f6e56;--amber:#9a6a00;--red:#a32d2d;--blue:#0c447c;--purple:#3c3489;}
  body.t-slate{--bg:#0e1217;--panel:#161b22;--panel2:#1d242d;--line:#2b3340;--text:#e8edf2;--muted:#8a97a6;--brand:#56b6c2;--brand2:#3f95a0;}
  body.t-grape{--bg:#150f22;--panel:#1e1633;--panel2:#271c44;--line:#392a57;--text:#ece6f7;--muted:#a597c0;--brand:#b98bff;--brand2:#9b6bff;}
  body.t-ocean{--bg:#eaf4f7;--panel:#ffffff;--panel2:#e7f2f5;--line:#cfe4ea;--text:#0e2a32;--muted:#577680;--brand:#0e8aa3;--brand2:#0c7689;--green:#0f9b6c;--amber:#bf850b;--red:#dd4a44;--blue:#0c447c;--purple:#5b4ca8;}
  body.t-mint{--bg:#ecf5ee;--panel:#ffffff;--panel2:#e9f4ec;--line:#d3e8d9;--text:#10291b;--muted:#5a7766;--brand:#1f9d5b;--brand2:#17854c;--green:#15a05f;--amber:#b9820a;--red:#e0443e;--blue:#0c447c;--purple:#5b4ca8;}
  body.t-sunset{--bg:#f8f0ea;--panel:#fffdfb;--panel2:#f6ece4;--line:#ecdcd0;--text:#33211a;--muted:#86695a;--brand:#e0664a;--brand2:#cf5538;--green:#15a05f;--amber:#c2870c;--red:#d83b3b;--blue:#0c447c;--purple:#7c5cff;}
  body.t-light .card,body.t-light .side,body.t-light .box,
  body.t-ocean .card,body.t-ocean .side,body.t-ocean .box,
  body.t-mint .card,body.t-mint .side,body.t-mint .box,
  body.t-sunset .card,body.t-sunset .side,body.t-sunset .box{box-shadow:0 1px 3px rgba(20,30,60,.05)}
  .theme-pop{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.28);padding:10px;z-index:300;width:215px}
  .theme-pop .tp-h{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin:2px 4px 8px}
  .theme-pop .tp-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .theme-pop .tp{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1.5px solid var(--line);border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text)}
  .theme-pop .tp:hover{background:var(--panel2)}
  .theme-pop .tp.on{border-color:var(--brand)}
  .theme-pop .sw{width:18px;height:18px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.15)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  .app{display:flex;min-height:100vh}
  .side{width:225px;background:var(--panel);border-right:1px solid var(--line);padding:14px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto}
  .logo{display:flex;align-items:center;gap:10px;padding:4px 6px 10px}
  .logo .dot{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
  .logo b{font-size:14px}.logo small{display:block;color:var(--muted);font-size:11px}
  .user{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px}
  .user .av{width:28px;height:28px;border-radius:50%;background:var(--brand2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .user b{font-size:12.5px}.user small{display:block;color:var(--muted);font-size:11px}
  .user .out{margin-left:auto;color:var(--muted);cursor:pointer;font-size:14px}
  .nav{display:flex;flex-direction:column}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--muted);cursor:pointer;font-weight:500;margin-bottom:1px;white-space:nowrap;font-size:13.5px}
  .nav a:hover{background:var(--panel2);color:var(--text)}
  .nav a.active{background:var(--brand);color:#fff}
  .nav a .ic{width:18px;text-align:center;flex-shrink:0}
  .nav .bell{margin-left:auto;background:var(--red);color:#fff;border-radius:20px;font-size:10px;padding:1px 7px;font-weight:700;display:none}
  .nav .sec{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:10px 11px 4px;font-weight:700}
  .main{flex:1;padding:20px 26px;max-width:1500px;width:100%;margin:0 auto;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
  .topbar h1{font-size:20px}.topbar .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
  .btn{background:var(--brand);color:#fff;border:none;padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;font-size:13px}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .btn.danger{background:var(--red)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .view{display:none}.view.active{display:block}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .kpi .label{color:var(--muted);font-size:12px}
  .kpi .val{font-size:25px;font-weight:800;margin-top:6px}
  .kpi .delta{font-size:11.5px;margin-top:4px;color:var(--muted)}
  .up{color:var(--green)}.down{color:var(--red)}
  .card h3{font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card h3 .tag{font-size:11px;color:var(--muted);font-weight:500}
  canvas{max-height:240px}
  .tbl-wrap{overflow:auto;border-radius:var(--radius)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--text)}
  tr:hover td{background:var(--panel2)}
  td.num,th.num{text-align:right}
  .chip{font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:600;display:inline-block;white-space:nowrap}
  .chip.green{background:rgba(62,207,142,.16);color:var(--green)}
  .chip.red{background:rgba(240,106,106,.16);color:var(--red)}
  .chip.amber{background:rgba(242,193,78,.18);color:var(--amber)}
  .chip.blue{background:rgba(91,140,255,.16);color:var(--blue)}
  .chip.purple{background:rgba(155,123,255,.16);color:var(--purple)}
  .chip.mut{background:var(--panel2);color:var(--muted)}
  .filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .filters input,.filters select{background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:8px 11px;color:var(--text);font-size:13px}
  .filters input:focus,.filters select:focus{outline:none;border-color:var(--brand)}
  .filters input.search{min-width:200px;flex:1}
  .filters .cnt{margin-left:auto;color:var(--muted);font-size:12px}
  .empty{padding:34px;text-align:center;color:var(--muted)}
  .alert{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel);cursor:pointer}
  .alert .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
  .alert.seen{opacity:.45}
  .alert.hi .ic{background:rgba(240,106,106,.16);color:var(--red)}
  .alert.mid .ic{background:rgba(242,193,78,.18);color:var(--amber)}
  .alert.lo .ic{background:var(--panel2);color:var(--muted)}
  .alert b{font-size:13px}.alert .who{font-size:11.5px;color:var(--muted)}
  .alert .seen-tag{font-size:11px;color:var(--green);white-space:nowrap}
  /* form modal */
  .modal{position:fixed;inset:0;background:rgba(8,12,22,.6);z-index:120;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
  .modal.show{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:720px;max-width:100%;box-shadow:0 18px 50px rgba(0,0,0,.4)}
  .modal .mh{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
  .modal .mh b{font-size:15px}
  .modal .mx{cursor:pointer;color:var(--muted);font-size:18px;padding:2px 8px;border-radius:6px}
  .modal .mx:hover{background:var(--panel2)}
  .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding:18px}
  .formgrid .fld label{font-size:11.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:5px}
  .formgrid .fld label .req{color:var(--red)}
  .formgrid .fld input,.formgrid .fld select,.formgrid .fld textarea{width:100%;background:var(--panel2);border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--text);font-size:13.5px}
  .formgrid .fld input:focus,.formgrid .fld select:focus,.formgrid .fld textarea:focus{outline:none;border-color:var(--brand)}
  .formgrid .fld.full{grid-column:1/-1}
  .modal .mf{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .mf .err{margin-right:auto;color:var(--red);font-size:12.5px;align-self:center}
  /* import preview */
  .impTable td,.impTable th{font-size:12px;padding:6px 8px}
  .impErr{color:var(--red)}
  /* login */
  .ov{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
  .ov.hide{display:none}
  .lbox{width:380px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px}
  .lbox .lg{display:flex;align-items:center;gap:11px;margin-bottom:6px}
  .lbox .dot{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
  .tabs{display:flex;gap:6px;margin:18px 0 4px}
  .tabs span{flex:1;text-align:center;padding:9px;border-radius:9px;background:var(--panel2);color:var(--muted);cursor:pointer;font-size:13px;font-weight:600}
  .tabs span.on{background:var(--brand);color:#fff}
  .lbox label{font-size:12px;color:var(--muted);display:block;margin:13px 0 5px}
  .lbox input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);font-size:14px}
  .lbox .full{width:100%;margin-top:18px}
  .msg{margin-top:14px;font-size:12.5px;line-height:1.5;padding:11px 13px;border-radius:9px;display:none}
  .msg.err{display:block;color:var(--red);background:rgba(240,106,106,.1);border:1px solid rgba(240,106,106,.3)}
  .msg.okk{display:block;color:var(--green);background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.3)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--brand);color:#04231a;font-weight:700;padding:11px 20px;border-radius:11px;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;transition:.3s;z-index:200;pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .hamb{display:none}
  @media(max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}}
  @media(max-width:760px){
    .app{flex-direction:column}.side{width:100%;height:auto;position:relative}
    .side.collapsed .nav,.side.collapsed .user{display:none}
    .hamb{display:block;margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 11px;cursor:pointer}
    .main{padding:14px}.filters input.search{min-width:130px}
  }
</style>
</head>
<body class="t-dark">

<!-- LOGIN -->
<div class="ov" id="login">
  <div class="lbox">
    <div class="lg"><div class="dot">R</div><div><b>RSA QLTK</b><small style="color:var(--muted);display:block">Quản lý tài khoản · tài nguyên · chi phí</small></div></div>
    <div class="tabs"><span class="on" data-t="in">Đăng nhập</span><span data-t="up">Đăng ký</span></div>
    <div id="tIn">
      <label>Email</label><input id="inEmail" type="email" placeholder="ban@rsa.vn">
      <label>Mật khẩu</label><input id="inPass" type="password" placeholder="••••••">
      <button class="btn full" id="btnIn">Đăng nhập</button>
    </div>
    <div id="tUp" style="display:none">
      <label>Họ tên</label><input id="upName" placeholder="Nguyễn Văn A">
      <label>Email</label><input id="upEmail" type="email" placeholder="ban@rsa.vn">
      <label>Mật khẩu (tối thiểu 6 ký tự)</label><input id="upPass" type="password" placeholder="Tạo mật khẩu">
      <button class="btn full" id="btnUp">Gửi đăng ký</button>
    </div>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<!-- PENDING -->
<div class="ov hide" id="pending">
  <div class="lbox" style="text-align:center">
    <div class="lg" style="justify-content:center"><div class="dot">R</div></div>
    <h3 style="margin:10px 0 8px">Tài khoản đang chờ duyệt</h3>
    <p style="color:var(--muted);font-size:13px;line-height:1.6">Đăng ký đã được ghi nhận. SD cần phê duyệt và gán vai trò trước khi bạn vào được. Liên hệ Hiếu (SD).</p>
    <button class="btn ghost full" id="btnPendOut" style="margin-top:18px">Đăng xuất</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" style="display:none">
  <aside class="side collapsed" id="side">
    <div class="logo"><div class="dot">R</div><div><b>RSA QLTK</b><small>RS Agency</small></div>
      <button class="hamb" id="hamb">☰</button></div>
    <div class="user"><div class="av" id="uAv">?</div><div><b id="uName">—</b><small id="uRole">—</small></div>
      <div style="margin-left:auto;display:flex;gap:8px"><div class="out" id="btnTheme" title="Đổi màu">◐</div><div class="out" id="btnOut" title="Đăng xuất">⎋</div></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <div id="pageArea"></div>
  </main>
</div>

<!-- FORM MODAL -->
<div class="modal" id="modal"><div class="box">
  <div class="mh"><b id="modalTitle">Form</b><div class="mx" onclick="closeModal()">✕</div></div>
  <div class="formgrid" id="modalBody"></div>
  <div class="mf"><span class="err" id="modalErr"></span>
    <button class="btn ghost" onclick="closeModal()">Hủy</button>
    <button class="btn" id="modalSave">Lưu</button></div>
</div></div>

<!-- IMPORT MODAL -->
<div class="modal" id="impModal"><div class="box">
  <div class="mh"><b id="impTitle">Nhập Excel</b><div class="mx" onclick="document.getElementById('impModal').classList.remove('show')">✕</div></div>
  <div id="impBody" style="padding:18px;max-height:60vh;overflow:auto"></div>
  <div class="mf"><span class="err" id="impInfo" style="color:var(--muted)"></span>
    <button class="btn ghost" onclick="document.getElementById('impModal').classList.remove('show')">Hủy</button>
    <button class="btn" id="impCommit">Xác nhận nhập</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ============ CẤU HÌNH SUPABASE ============ */
const SUPABASE_URL='https://oaeywvuibltnokdkbpvg.supabase.co';
const SUPABASE_KEY='sb_publishable_UW_EwaozbQ_ZiI4-COHFKg_yPOTKT5A';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let ME=null, CACHE={}, CATS={}, ACCOUNTS=[], PERMS={};
const ROLE_LABEL={SD:'SD',QL:'Leader',PA:'Quản lý tài khoản',SELLER:'Seller',PENDING:'Chờ duyệt'};
const rlabel=r=>ROLE_LABEL[r]||r;

/* ============ TIỆN ÍCH ============ */
const $=id=>document.getElementById(id);
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr=()=>new Date().toISOString().slice(0,10);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function num(v){const n=Number(v);return isNaN(n)?0:n;}
function fmtVnd(v){return num(v).toLocaleString('vi-VN');}
function fmtUsd(v){return num(v).toLocaleString('en-US',{maximumFractionDigits:2});}
function daysBetween(a,b){if(!a)return null;return Math.floor((new Date(b||todayStr())-new Date(a))/86400000);}
function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toISOString().slice(0,10);}
function parseDateAny(v){if(!v)return null;if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
  const s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return null;}
async function logAct(action,table,label,detail){try{await sb.from('activity_log').insert({user_id:ME.id,user_name:ME.full_name||ME.email,action,target_table:table,target_label:String(label||''),detail:detail||''});}catch(e){}}

/* ============ AUTH ============ */
document.querySelectorAll('.tabs span').forEach(s=>s.onclick=()=>{
  document.querySelectorAll('.tabs span').forEach(x=>x.classList.remove('on'));s.classList.add('on');
  $('tIn').style.display=s.dataset.t==='in'?'block':'none';$('tUp').style.display=s.dataset.t==='up'?'block':'none';$('loginMsg').className='msg';});
function lmsg(t,cls){$('loginMsg').textContent=t;$('loginMsg').className='msg '+cls;}
$('btnIn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('inEmail').value.trim(),password:$('inPass').value});if(error)return lmsg('Sai email hoặc mật khẩu.','err');boot();};
$('btnUp').onclick=async()=>{const name=$('upName').value.trim();if(!name)return lmsg('Điền họ tên.','err');
  const {error}=await sb.auth.signUp({email:$('upEmail').value.trim(),password:$('upPass').value,options:{data:{full_name:name}}});
  if(error)return lmsg('Lỗi: '+error.message,'err');boot();};
$('inPass').addEventListener('keydown',e=>{if(e.key==='Enter')$('btnIn').click();});
$('btnOut').onclick=$('btnPendOut').onclick=async()=>{await sb.auth.signOut();location.reload();};
const THEMES=[['t-dark','Tối','#0f1117'],['t-slate','Slate','#56b6c2'],['t-grape','Grape','#b98bff'],['t-light','Sáng','#e5e4dd'],['t-ocean','Ocean','#0e8aa3'],['t-mint','Mint','#1f9d5b'],['t-sunset','Sunset','#e0664a']];
$('btnTheme').onclick=(e)=>{e.stopPropagation();
  let p=$('themePop');if(p){p.remove();return;}
  p=document.createElement('div');p.id='themePop';p.className='theme-pop';
  p.innerHTML='<div class="tp-h">Bảng màu</div><div class="tp-grid">'+THEMES.map(t=>`<div class="tp ${document.body.classList.contains(t[0])?'on':''}" onclick="applyTheme('${t[0]}')"><span class="sw" style="background:${t[2]}"></span>${t[1]}</div>`).join('')+'</div>';
  document.body.appendChild(p);
  const r=$('btnTheme').getBoundingClientRect();
  p.style.left=Math.max(8,Math.min(r.left,innerWidth-230))+'px';p.style.top=(r.bottom+8)+'px';
};
function applyTheme(t){document.body.className=t;localStorage.setItem('rsa_theme',t);const p=$('themePop');if(p)p.remove();}
document.addEventListener('click',e=>{const p=$('themePop');if(p&&!p.contains(e.target)&&e.target.id!=='btnTheme')p.remove();});

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){show('login');return;}
  const {data:prof}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(!prof){show('login');return;}
  ME=prof;
  if(prof.status!=='approved'||prof.role==='PENDING'){show('pending');return;}
  show('app');
  $('uName').textContent=prof.full_name||prof.email;
  $('uRole').textContent=rlabel(prof.role)+(prof.seller_name?' · '+prof.seller_name:'');
  $('uAv').textContent=(prof.full_name||prof.email||'?').slice(0,1).toUpperCase();
  await loadCats();
  await loadMenuPerms();
  buildNav();
  go('dash');
}
function show(w){$('login').classList.toggle('hide',w!=='login');$('pending').classList.toggle('hide',w!=='pending');$('app').style.display=w==='app'?'flex':'none';}

async function loadCats(){
  const {data}=await sb.from('categories').select('*').eq('active',true).order('sort');
  CATS={};(data||[]).forEach(c=>{(CATS[c.group_name]=CATS[c.group_name]||[]).push(c.value);});
}
function catOpts(g){return CATS[g]||[];}
async function loadMenuPerms(){
  const {data}=await sb.from('menu_permissions').select('*');
  PERMS={};(data||[]).forEach(r=>PERMS[r.role+'|'+r.menu_key]=r.allowed);
}
function menuAllowed(n,role){
  if(role==='SD')return true;
  if(n.key==='perms'||n.key==='log')return false; // luôn chỉ SD
  const k=role+'|'+n.key;
  if(PERMS[k]!==undefined)return PERMS[k];
  return n.roles.includes(role);
}

/* ============ ENGINE: render module bảng ============ */
let MOD_STATE={};
async function renderModule(key){
  const cfg=MODULES[key];
  await loadAccounts();
  if(key==='accounts'){const {data:oc}=await sb.from('cases').select('account_id,status');window.OPEN_KH=new Set((oc||[]).filter(c=>['Pending','Đang xử lý','Chờ support'].includes(c.status)).map(c=>c.account_id));}
  const canEdit=['SD','PA'].includes(ME.role);
  const canAdd=canEdit||(key==='requests'&&ME.role==='SELLER'&&ME.seller_name);
  const showAct=canEdit||key==='requests';
  $('pageArea').innerHTML=`
    <div class="topbar"><div><h1>${cfg.title}</h1><div class="sub">${cfg.sub}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost sm" onclick="tplXlsx('${key}')">⤓ Form mẫu</button>
        ${canEdit?`<button class="btn ghost sm" onclick="$('impFile').click()">⤴ Nhập Excel</button>`:''}
        <button class="btn ghost sm" onclick="exportXlsx('${key}')">⇩ Xuất Excel</button>
        ${canAdd?`<button class="btn sm" onclick="openForm('${key}')">+ Thêm</button>`:''}
        <input type="file" id="impFile" accept=".xlsx,.xls,.csv" style="display:none" onchange="importXlsx('${key}',this.files[0]);this.value=''">
      </div></div>
    <div class="filters"><input class="search" id="modSearch" placeholder="Tìm..." oninput="paintRows('${key}')">
      ${cfg.sellerScope&&['SD','QL','PA'].includes(ME.role)?`<select id="modSeller" onchange="paintRows('${key}')"><option value="">Tất cả seller</option>${catOpts('seller').map(s=>`<option>${esc(s)}</option>`).join('')}</select>`:''}
      <span class="cnt" id="modCount"></span></div>
    <div class="card" style="padding:0"><div class="tbl-wrap"><table>
      <thead><tr>${cfg.cols.map(c=>`<th>${colLabel(cfg,c)}</th>`).join('')}${showAct?'<th></th>':''}</tr></thead>
      <tbody id="modBody"></tbody></table>
      <div class="empty" id="modEmpty" style="display:none">Chưa có dữ liệu. ${canEdit?'Bấm "+ Thêm" hoặc Nhập Excel.':''}</div>
    </div></div>`;
  let q=sb.from(cfg.table).select('*').order('id',{ascending:false});
  const {data,error}=await q;
  if(error){$('modBody').innerHTML=`<tr><td colspan="9" style="color:var(--red);padding:16px">Lỗi tải: ${esc(error.message)}</td></tr>`;return;}
  MOD_STATE[key]=data||[];
  paintRows(key);
}
function colLabel(cfg,c){
  const map={account_label:'TK',platform:'Sàn',seller:'Seller',sla:'SLA',wait:'Chờ (ngày)',exp:'Còn lại',stageBar:'Giai đoạn'};
  if(map[c])return map[c];
  const f=cfg.fields.find(x=>x.k===c);return f?f.l:c;
}
function paintRows(key){
  const cfg=MODULES[key];let rows=(MOD_STATE[key]||[]).slice();
  const term=($('modSearch')?.value||'').toLowerCase();
  if(term)rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(term));
  if(ME.role==='SELLER'&&cfg.sellerScope)rows=rows.filter(r=>r.seller===ME.seller_name);
  const sf=$('modSeller')?.value;if(sf)rows=rows.filter(r=>r.seller===sf);
  const canEdit=['SD','PA'].includes(ME.role);
  const showAct=canEdit||key==='requests';
  $('modCount').textContent=rows.length+' dòng';
  $('modEmpty').style.display=rows.length?'none':'block';
  $('modBody').innerHTML=rows.map(r=>`<tr>${cfg.cols.map(c=>`<td>${cellVal(cfg,r,c)}</td>`).join('')}${showAct?`<td style="text-align:right;white-space:nowrap">${rowActs(key,r,canEdit)}</td>`:''}</tr>`).join('');
}
function rowActs(key,r,canEdit){
  let h='';
  if(key==='requests'){

function badge(cfg,field,val){const b=cfg.badges&&cfg.badges[field]&&cfg.badges[field][val];return `<span class="chip ${b||'mut'}">${esc(val||'—')}</span>`;}
function cellVal(cfg,r,c){

  if(c==='wait'){const d=daysBetween(r.request_date);if(r.approval_status!=='Chờ duyệt')return '<span class="chip mut">—</span>';return `<span class="chip ${d>2?'red':'amber'}">${d??0}d</span>`;}
  if(c==='exp'){const k=r.date_end||r.renew_date||r.data_expiry;const d=daysBetween(todayStr(),k);if(!k)return '<span class="chip mut">—</span>';if(d<0)return '<span class="chip red">hết hạn</span>';return `<span class="chip ${d<=7?'amber':'green'}">${d}d</span>`;}
  if(c==='stageBar'){return badge(cfg,'stage',r.stage);}

  if(cfg.badges&&cfg.badges[c]){let h=badge(cfg,c,v);if(c==='status'&&cfg.table==='accounts'&&window.OPEN_KH&&window.OPEN_KH.has(r.id))h+=' <span class="chip purple">⚖ kháng</span>';return h;}
  if(f&&f.t==='num'){if(c.endsWith('_vnd'))return `<span class="num">${fmtVnd(v)}</span>`;if(c.endsWith('_usd'))return `<span class="num">${fmtUsd(v)}</span>`;return v??'';}
  if(f&&f.sensitive&&ME.role==='SELLER')return '<span class="chip mut">ẩn</span>';

}

function modCols(cfg){return cfg.fields.filter(f=>!(f.sensitive)).map(f=>f.l);}

let IMP_ROWS=null, IMP_KEY=null;
async function importXlsx(key,file){
  if(!file)return;const cfg=MODULES[key];if(!window.XLSX)return toast('Thư viện Excel chưa sẵn sàng');
  const buf=await file.arrayBuffer();const wb=XLSX.read(new Uint8Array(buf),{type:'array',cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];const raw=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
  if(!raw.length)return toast('File trống');
  const labelToKey={};cfg.fields.forEach(f=>labelToKey[f.l]=f);
  const existing=MOD_STATE[key]||[];
  const parsed=raw.map((r,i)=>{
    const o={},errs=[];
    cfg.fields.forEach(f=>{
      let v=r[f.l];if(v===''||v==null){if(f.req)errs.push('thiếu '+f.l);o[f.k]=null;return;}
      if(f.t==='num')v=num(v);
      else if(f.t==='date'){const d=parseDateAny(v);if(!d&&v)errs.push('sai ngày '+f.l);v=d;}
      else if(f.t==='acc'){const a=ACCOUNTS.find(x=>x.name===String(v).trim()||(x.name+' ('+x.platform+')')===String(v).trim());v=a?a.id:null;}
      else if((f.t==='sel'||f.t==='cat')){const opts=f.t==='cat'?catOpts(f.cat):f.opts;if(v&&!opts.includes(String(v).trim()))errs.push(f.l+' ngoài danh mục');v=String(v).trim();}
      o[f.k]=v;
    });
    // trùng khóa (chỉ check khi module có khóa và giá trị khóa không rỗng)
    if(cfg.key&&cfg.key.every(k=>String(o[k]??'').trim()!=='')){
      const dup=existing.find(e=>cfg.key.every(k=>String(e[k]??'')===String(o[k]??'')));
      if(dup)o._dup=dup.id;
    }
    o._row=i+2;o._errs=errs;
    return o;
  });
  IMP_ROWS=parsed;IMP_KEY=key;
  const okCount=parsed.filter(p=>!p._errs.length).length;
  const errCount=parsed.length-okCount;const dupCount=parsed.filter(p=>p._dup).length;
  $('impTitle').textContent='Nhập Excel · '+cfg.title;
  $('impBody').innerHTML=`<div style="margin-bottom:10px;font-size:13px">Đọc ${parsed.length} dòng · <b style="color:var(--green)">${okCount} hợp lệ</b> · <b style="color:var(--red)">${errCount} lỗi</b> · ${dupCount} trùng.</div>
    <table class="impTable"><thead><tr><th>Dòng</th><th>Tên/Nội dung</th><th>Trùng?</th><th>Kết quả kiểm tra</th></tr></thead><tbody>
    ${parsed.slice(0,200).map(p=>`<tr><td>${p._row}</td><td>${esc(p.name||p.content||p.gmail||p.batch_name||p.brand||p.llc_name||p.proxy_string||p.person||'')}</td>
      <td>${p._dup?'<span class="chip amber">trùng</span>':''}</td>
      <td>${p._errs.length?'<span class="impErr">'+esc(p._errs.join(', '))+'</span>':'<span class="chip green">OK</span>'}</td></tr>`).join('')}
    </tbody></table>`;
  $('impInfo').innerHTML=dupCount?`Dòng trùng sẽ: <select id="impDupMode"><option value="skip">Bỏ qua</option><option value="update">Cập nhật đè</option></select>`:'';
  $('impModal').classList.add('show');
}
$('impCommit').onclick=async()=>{
  const cfg=MODULES[IMP_KEY];const dupMode=$('impDupMode')?.value||'skip';
  const good=IMP_ROWS.filter(p=>!p._errs.length);
  let ins=0,upd=0,skip=0;
  $('impCommit').disabled=true;
  for(const p of good){
    const payload={};cfg.fields.forEach(f=>{if(p[f.k]!==undefined)payload[f.k]=p[f.k];});
    if(p._dup){
      if(dupMode==='skip'){skip++;continue;}
      if(cfg.table==='accounts')delete payload.status; // import không đổi trạng thái TK
      const {error}=await sb.from(cfg.table).update(payload).eq('id',p._dup);if(!error)upd++;
    }else{
      Object.keys(payload).forEach(k=>{if(payload[k]==null)delete payload[k];});
      if(cfg.userCol)payload[cfg.userCol]=ME.id;
      const {error}=await sb.from(cfg.table).insert(payload);if(!error)ins++;
    }
  }
  await logAct('Nhập Excel',cfg.table,cfg.title,`thêm ${ins}, cập nhật ${upd}, bỏ qua ${skip}`);
  $('impModal').classList.remove('show');$('impCommit').disabled=false;
  toast(`Nhập xong: +${ins} mới, ${upd} cập nhật, ${skip} bỏ qua`);
  renderModule(IMP_KEY);
};

  const byPlat=p=>pend.filter(c=>c.platform===p).length;
  $('caseBox').innerHTML=`<div style="display:flex;gap:18px;flex-wrap:wrap;font-size:13px">
    <div><div class="kpi"><div class="label">Đang tồn</div><div class="val">${pend.length}</div></div></div>
    <div style="align-self:center">TTS ${byPlat('TTS')} · AMZ ${byPlat('AMZ')} · Etsy ${byPlat('Etsy')}<br>
    <span class="muted">Thành công: ${cases.filter(c=>c.status==='Thành công').length} · Thất bại/Dừng: ${cases.filter(c=>['Thất bại','Dừng'].includes(c.status)).length}</span></div></div>`;
  // finance
  const balUsd=accs.filter(a=>a.status==='Active').reduce((s,a)=>s+num(a.balance_usd),0);
  const holdUsd=accs.reduce((s,a)=>s+num(a.onhold_usd),0);
  const lostUsd=accs.filter(a=>a.status==='Die').reduce((s,a)=>s+num(a.balance_usd),0);
  const now=new Date(),m=now.getMonth(),y=now.getFullYear();
  const expMonth=exps.filter(e=>{const d=new Date(e.expense_date);return d.getMonth()===m&&d.getFullYear()===y;}).reduce((s,e)=>s+num(e.amount_vnd),0);
  const expAll=exps.reduce((s,e)=>s+num(e.amount_vnd),0);
  $('finBox').innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px">
    <div><div class="label muted">Balance active</div><b>$${fmtUsd(balUsd)}</b></div>
    <div><div class="label muted">On-hold</div><b>$${fmtUsd(holdUsd)}</b></div>
    <div><div class="label muted">Mất do Die</div><b style="color:var(--red)">$${fmtUsd(lostUsd)}</b></div>
    <div><div class="label muted">Chi tháng này</div><b>${fmtVnd(expMonth)}₫</b></div>
    <div><div class="label muted">Chi từ đầu</div><b>${fmtVnd(expAll)}₫</b></div></div>`;
  // pipeline
  $('pipeBox').innerHTML=pipes.length?pipes.map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><div><b>${esc(p.batch_name)}</b> <span class="muted">· ${esc(p.platform)} · ${p.qty} TK</span></div>${badge(MODULES.pipeline,'stage',p.stage)}</div>`).join(''):'<div class="empty">Chưa có batch</div>';
  // alerts
  await loadSeen();const al=await computeAlerts();window._alerts=al;
  const hi=al.map((a,i)=>({a,i})).filter(x=>x.a.lv==='hi').slice(0,6);
  $('dashAlerts').innerHTML=hi.length?hi.map(x=>alertHtml(x.a,x.i)).join(''):'<div class="empty">Không có cảnh báo cao 🎉</div>';
  updateAlertBadge(al);
}

/* ============ CẢNH BÁO ============ */
async function computeAlerts(){
  const [accR,caseR,reqR,proxR,toolR,llcR,cardR]=await Promise.all([
    sb.from('accounts').select('*'),sb.from('cases').select('*'),sb.from('account_requests').select('*'),
    sb.from('proxies').select('*'),sb.from('tool_accounts').select('*'),sb.from('llcs').select('*'),sb.from('card_charges').select('*')]);
  const accs=accR.data||[],cases=caseR.data||[],reqs=reqR.data||[],prox=proxR.data||[],tools=toolR.data||[],llcs=llcR.data||[],cards=cardR.data||[];
  const A=[];const D=(k,b)=>daysBetween(b||todayStr(),k);
  accs.forEach(a=>{if(['Die','Suspend'].includes(a.status)&&a.status_changed_at&&daysBetween(a.status_changed_at)<=1)A.push({lv:'hi',ic:'🔴',t:`TK ${a.name} chuyển ${a.status} trong 24h`,w:`seller ${a.seller} · lỗi ${a.error_type||'?'}`});
    if(['Die','Suspend'].includes(a.status)&&num(a.onhold_usd)>500)A.push({lv:'hi',ic:'🔴',t:`TK ${a.name} khóa — $${fmtUsd(a.onhold_usd)} on-hold`,w:`seller ${a.seller}`});});
  // seller retention <60
  const sellers=[...new Set(accs.map(a=>a.seller).filter(Boolean))];
  sellers.forEach(s=>{const list=accs.filter(a=>a.seller===s);const act=list.filter(x=>x.status==='Active').length;const tot=list.filter(x=>['Active','Die','Suspend','Thu hồi'].includes(x.status)).length;if(tot>=3){const r=Math.round(act/tot*100);if(r<60)A.push({lv:'mid',ic:'🟠',t:`${s} tỷ lệ giữ TK thấp: ${r}%`,w:`${act}/${tot} active`});}});
  cases.forEach(c=>{if(['Pending','Đang xử lý'].includes(c.status)){const d=daysBetween(c.date_start);if(d>3&&!c.date_appeal)A.push({lv:'mid',ic:'🟠',t:`Case ${accLabel(c.account_id)} tồn ${d} ngày chưa gửi kháng`,w:c.error_type});}});
  reqs.forEach(r=>{if(r.approval_status==='Chờ duyệt'){const d=daysBetween(r.request_date);if(d>2)A.push({lv:'lo',ic:'🟡',t:`${r.seller} yêu cầu cấp TK chưa duyệt`,w:`${d} ngày · ${r.account_type}`});}});
  prox.forEach(p=>{if(p.status==='Active'&&p.date_end){const d=D(p.date_end);if(d>=0&&d<=7)A.push({lv:'mid',ic:'🟠',t:`Proxy ${p.profile_name||p.proxy_string} hết hạn trong ${d} ngày`,w:p.vendor||''});}});
  tools.forEach(t=>{if(t.status!=='Dừng'&&t.renew_date){const d=D(t.renew_date);if(d>=0&&d<=7)A.push({lv:'mid',ic:'🟠',t:`Tool ${t.tool_type} đến hạn gia hạn trong ${d} ngày`,w:t.mail||''});}});
  accs.forEach(a=>{if(a.warranty_end){const d=D(a.warranty_end);if(d>=0&&d<=5)A.push({lv:'mid',ic:'🟠',t:`TK ${a.name} hết bảo hành trong ${d} ngày`,w:`seller ${a.seller}`});}
    if(a.phone_change_due){const d=D(a.phone_change_due);if(d>=0&&d<=7)A.push({lv:'lo',ic:'🟡',t:`TK ${a.name} đến hạn thay phone trong ${d} ngày`,w:''});}});
  llcs.forEach(l=>{if(l.end_date){const d=D(l.end_date);if(d>=0&&d<=30)A.push({lv:'lo',ic:'🟡',t:`LLC ${l.llc_name} hết hạn trong ${d} ngày`,w:l.owner_name});}});
  cards.forEach(c=>{if(num(c.balance_vnd)>0&&num(c.balance_vnd)<1200000)A.push({lv:'lo',ic:'🟡',t:`Thẻ charge ${c.person} số dư thấp: ${fmtVnd(c.balance_vnd)}₫`,w:c.period_label});});
  try{
    const {data:snaps}=await sb.from('weekly_snapshots').select('*').order('week_start');
    const wk=mondayOf(new Date());const prev=(snaps||[]).filter(s=>s.week_start<wk).pop();
    if(prev){const prevTot=num(prev.tts_active)+num(prev.amz_active)+num(prev.etsy_active)+num(prev.other_active);
      const curTot=accs.filter(a=>a.status==='Active').length;
      if(prevTot-curTot>3)A.push({lv:'hi',ic:'🔴',t:`Tổng active giảm ${prevTot-curTot} TK so với tuần trước`,w:`${prevTot} → ${curTot}`});}
  }catch(e){}
  A.forEach(a=>a.key=a.t);
  const order={hi:0,mid:1,lo:2};A.sort((x,y)=>order[x.lv]-order[y.lv]);
  return A;
}
let SEEN=new Set();
function alertHtml(a,i){const seen=SEEN.has(a.key);return `<div class="alert ${a.lv} ${seen?'seen':''}" onclick="markSeenIdx(this,${i})"><div class="ic">${a.ic}</div><div><b>${esc(a.t)}</b><div class="who">${esc(a.w||'')}</div></div>${seen?'<span class="seen-tag">✓ đã xem</span>':'<span class="who">bấm để ẩn</span>'}</div>`;}
async function markSeenIdx(el,i){const a=(window._alerts||[])[i];if(!a)return;SEEN.add(a.key);el.classList.add('seen');try{await sb.from('alert_seen').insert({alert_key:a.key.slice(0,300),user_id:ME.id});}catch(e){}updateAlertBadge(window._alerts);}
async function loadSeen(){const {data}=await sb.from('alert_seen').select('alert_key').eq('user_id',ME.id);SEEN=new Set((data||[]).map(x=>x.alert_key));}
function updateAlertBadge(al){const cnt=(al||[]).filter(a=>!SEEN.has(a.key)).length;const b=$('navAlerts');if(b){b.textContent=cnt;b.style.display=cnt?'inline-block':'none';}}
async function renderAlerts(){
  $('pageArea').innerHTML=`<div class="topbar"><div><h1>Cảnh báo</h1><div class="sub">Tự sinh từ dữ liệu · ưu tiên cao → thấp</div></div>
    <button class="btn ghost sm" onclick="markAllSeen()">✓ Đánh dấu tất cả đã xem</button></div><div id="alertList"></div>`;
  await loadSeen();const al=await computeAlerts();window._alerts=al;
  $('alertList').innerHTML=al.length?al.map((a,i)=>alertHtml(a,i)).join(''):'<div class="card empty">Không có cảnh báo nào 🎉</div>';
  updateAlertBadge(al);
}
async function markAllSeen(){for(const a of (window._alerts||[])){if(!SEEN.has(a.key)){SEEN.add(a.key);try{await sb.from('alert_seen').insert({alert_key:a.key.slice(0,300),user_id:ME.id});}catch(e){}}}renderAlerts();toast('Đã đánh dấu tất cả ✓');}

/* ============ PHÂN QUYỀN ============ */
const MATRIX_ROLES=[['QL','Leader'],['PA','Quản lý tài khoản'],['SELLER','Seller']];
async function renderPerms(){
  const items=NAV.filter(n=>!n.sec&&n.key!=='perms'&&n.key!=='log');
  $('pageArea').innerHTML=`<div class="topbar"><div><h1>Phân quyền</h1><div class="sub">Duyệt người dùng · gán & đổi vai trò · khóa · quyền xem menu</div></div></div>
    <div class="card" style="margin-bottom:14px"><h3>Quyền xem menu <span class="tag">SD tick để mở/khóa menu cho từng vai trò rồi Lưu</span></h3>
      <div class="tbl-wrap"><table><thead><tr><th>Menu</th><th style="text-align:center">SD</th>${MATRIX_ROLES.map(([c,l])=>`<th style="text-align:center">${l}</th>`).join('')}</tr></thead><tbody>
      ${items.map(n=>`<tr><td>${n.label}</td><td style="text-align:center">✓</td>${MATRIX_ROLES.map(([c])=>{
        const k=c+'|'+n.key;const on=PERMS[k]!==undefined?PERMS[k]:n.roles.includes(c);
        return `<td style="text-align:center"><input type="checkbox" id="mp_${c}_${n.key}" ${on?'checked':''}></td>`;}).join('')}</tr>`).join('')}
      <tr><td>Nhật ký</td><td style="text-align:center">✓</td>${MATRIX_ROLES.map(()=>'<td style="text-align:center" class="muted">—</td>').join('')}</tr>
      <tr><td>Phân quyền</td><td style="text-align:center">✓</td>${MATRIX_ROLES.map(()=>'<td style="text-align:center" class="muted">—</td>').join('')}</tr>
      </tbody></table></div>
      <div style="margin-top:12px"><button class="btn" onclick="saveMenuPerms()">Lưu phân quyền</button></div>
      <div class="muted" style="font-size:11.5px;margin-top:10px">Lưu ý: bảo mật dữ liệu (Seller chỉ thấy TK của mình, chỉ SD xóa/đổi vai trò, Leader không sửa data...) luôn được hệ thống enforce ở database, không phụ thuộc bảng này. Bảng này chỉ ẩn/hiện menu.</div>
    </div>
    <div class="card" style="margin-bottom:14px"><h3>Chờ phê duyệt <span class="tag">gán vai trò + (seller nếu là Seller) rồi Duyệt</span></h3><div id="pendList" class="muted">Đang tải...</div></div>
    <div class="card"><h3>Người dùng đã duyệt</h3><div id="apprList" class="muted">Đang tải...</div></div>`;
  const {data:profs}=await sb.from('profiles').select('*').order('created_at');
  const sellers=catOpts('seller');
  const roleSel=p=>`<select id="role_${p.id}">${['SELLER','PA','QL','SD'].map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${rlabel(r)}</option>`).join('')}</select>`;
  const sellerSel=p=>`<select id="seller_${p.id}"><option value="">— seller —</option>${sellers.map(s=>`<option ${p.seller_name===s?'selected':''}>${esc(s)}</option>`).join('')}</select>`;
  const pend=(profs||[]).filter(p=>p.status==='pending');
  $('pendList').innerHTML=pend.length?`<div class="tbl-wrap"><table><thead><tr><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Seller</th><th></th></tr></thead><tbody>${pend.map(p=>`<tr><td>${esc(p.full_name)}</td><td>${esc(p.email)}</td><td>${roleSel(p)}</td><td>${sellerSel(p)}</td><td><button class="btn sm" onclick="approveUser('${p.id}')">Duyệt</button></td></tr>`).join('')}</tbody></table></div>`:'Không có đăng ký chờ duyệt.';
  const appr=(profs||[]).filter(p=>p.status!=='pending');
  $('apprList').innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Seller</th><th>Trạng thái</th><th></th></tr></thead><tbody>${appr.map(p=>`<tr><td>${esc(p.full_name)}</td><td>${esc(p.email)}</td><td>${roleSel(p)}</td><td>${sellerSel(p)}</td><td>${p.status==='approved'?'<span class="chip green">Hoạt động</span>':'<span class="chip red">Khóa</span>'}</td><td style="white-space:nowrap"><button class="btn ghost sm" onclick="saveUser('${p.id}')">Lưu</button> ${p.id===ME.id?'':(p.status==='approved'?`<button class="btn danger sm" onclick="lockUser('${p.id}',true)">Khóa</button>`:`<button class="btn sm" onclick="lockUser('${p.id}',false)">Mở</button>`)}</td></tr>`).join('')}</tbody></table></div>`;
}
async function saveMenuPerms(){
  const items=NAV.filter(n=>!n.sec&&n.key!=='perms'&&n.key!=='log');
  const rows=[];
  for(const [c] of MATRIX_ROLES)for(const n of items){
    const el=$('mp_'+c+'_'+n.key);if(el)rows.push({role:c,menu_key:n.key,allowed:el.checked});
  }
  const {error}=await sb.from('menu_permissions').upsert(rows,{onConflict:'role,menu_key'});
  if(error)return toast('Lỗi: '+error.message);
  await logAct('Lưu quyền menu','menu_permissions','',rows.length+' dòng');
  await loadMenuPerms();buildNav();toast('Đã lưu phân quyền ✓');
}
async function approveUser(id){const role=$('role_'+id).value,seller=$('seller_'+id).value;if(role==='SELLER'&&!seller)return toast('Seller phải chọn tên seller');const {error}=await sb.from('profiles').update({role,seller_name:role==='SELLER'?seller:null,status:'approved'}).eq('id',id);if(error)return toast('Lỗi: '+error.message);await logAct('Duyệt user','profiles',id,role);toast('Đã duyệt ✓');renderPerms();}
async function saveUser(id){const role=$('role_'+id).value,seller=$('seller_'+id).value;if(role==='SELLER'&&!seller)return toast('Seller phải chọn tên seller');const {error}=await sb.from('profiles').update({role,seller_name:role==='SELLER'?seller:null}).eq('id',id);if(error)return toast('Lỗi: '+error.message);await logAct('Sửa vai trò','profiles',id,role);toast('Đã lưu ✓');renderPerms();}
async function lockUser(id,lock){const {error}=await sb.from('profiles').update({status:lock?'locked':'approved'}).eq('id',id);if(error)return toast('Lỗi: '+error.message);await logAct(lock?'Khóa':'Mở','profiles',id,'');renderPerms();}

/* ============ DANH MỤC ============ */
const CAT_GROUPS=[['seller','Seller'],['nguon_tk','Nguồn TK'],['nhom_chi_phi','Nhóm chi phí'],['loai_loi','Loại lỗi'],['noi_mua','Nơi mua'],['loai_tool','Loại tool']];
let catGroup='seller';
async function renderCats(){
  $('pageArea').innerHTML=`<div class="topbar"><div><h1>Danh mục</h1><div class="sub">Dropdown toàn hệ thống. Người nghỉ → Tắt, đừng xóa (giữ lịch sử).</div></div></div>
    <div class="filters">${CAT_GROUPS.map(([k,l])=>`<button class="btn ${k===catGroup?'':'ghost'} sm" onclick="catGroup='${k}';renderCats()">${l}</button>`).join('')}</div>
    <div class="card"><div class="filters"><input class="search" id="newCat" placeholder="Thêm giá trị mới..." style="max-width:240px"><button class="btn sm" onclick="addCat()">+ Thêm</button></div><div id="catList" class="muted">Đang tải...</div></div>`;
  const {data}=await sb.from('categories').select('*').eq('group_name',catGroup).order('sort').order('value');
  $('catList').innerHTML=(data&&data.length)?`<div class="tbl-wrap"><table><thead><tr><th>Giá trị</th><th>Trạng thái</th><th></th></tr></thead><tbody>${data.map(c=>`<tr><td>${esc(c.value)}</td><td>${c.active?'<span class="chip green">Đang dùng</span>':'<span class="chip mut">Tắt</span>'}</td><td style="white-space:nowrap"><button class="btn ghost sm" onclick="toggleCat(${c.id},${!c.active})">${c.active?'Tắt':'Bật'}</button> ${ME.role==='SD'?`<button class="btn danger sm" onclick="delCat(${c.id},'${esc(c.value)}')">Xóa</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'Chưa có giá trị.';
}
async function addCat(){const v=$('newCat').value.trim();if(!v)return;const {error}=await sb.from('categories').insert({group_name:catGroup,value:v});if(error)return toast(error.code==='23505'?'Đã tồn tại':'Lỗi: '+error.message);await loadCats();renderCats();}
async function toggleCat(id,a){await sb.from('categories').update({active:a}).eq('id',id);await loadCats();renderCats();}
async function delCat(id,v){if(!confirm('Xóa "'+v+'"? Nên Tắt nếu đã dùng.'))return;await sb.from('categories').delete().eq('id',id);await loadCats();renderCats();}
